# Phase 2 of the orphan-recipe run (#5002): which unreached audit-* recipes GATE.
#
# `pinned` recipes passed on the first scheduled runs (2026-09-06 through 2026-09-28,
# identical 27-recipe set) -- plus audit-test-rigor-gate, green once the eda extra was
# added -- and must keep passing: a pinned recipe that fails makes audit-orphans.yml
# fail. This is a list of recipes EXPECTED TO PASS, not an exemption
# list -- a recipe absent from it is reported but not gated.
#
# Every derived orphan that is not pinned is named in [not_pinned] with its reason, so
# "not gated" is always a stated decision. A derived orphan in neither table is
# reported as UNCLASSIFIED; pin it once it has passed.

pinned = [
  "audit-api-ergonomics-gate",  # baseline re-seeded 2026-10-01 (#5682)
  "audit-baseline-contract",
  "audit-bootstrap",  # green once both gates it aggregates were (#5682)
  "audit-correctness-gate",
  "audit-coverage-dag-all",
  "audit-docs-build",
  "audit-docs-judgment",
  "audit-documentation-gate",
  "audit-emit-contract",
  "audit-empirical-oracle",
  "audit-foundation",
  "audit-judgment",
  "audit-performance-gate",
  "audit-plugin-manifest",
  "audit-port-bridge",
  "audit-profiling-contract",
  "audit-promotion-gate",
  "audit-refute-promote",
  "audit-release-readiness",
  "audit-routing-contract",
  "audit-rubrics-contract",
  "audit-structure-complexity-gate",  # baseline re-seeded 2026-10-01 (#5682)
  "audit-test-rigor-gate",  # green on its first run with the eda extra (run 36766318687)
  "audit-test-rigor-gate-quick",
  "audit-tombstone-contract",
  "audit-type-hardening-gate",
]

# Per-recipe wall-clock budgets (seconds), replacing the 900 s default for recipes whose
# honest runtime exceeds it. audit-release-readiness runs the FULL test suite (see its
# Justfile recipe), so the 900 s default killed it at exit 124 on every weekly run since
# 2026-10-01 (#5710). Must stay below the workflow's 90-minute job timeout.
[timeouts]
audit-release-readiness = 3000

# Orphans the scheduled run records as SKIP, never as PASS and never gated (#5710).
[skipped]
audit-drift-check = "praxia not installed on the CI runner: the check diffs authored workflow templates against the exports `praxia plugin install` writes to ~/.praxia/workflows, which do not exist there, so every template reports missing_export. Runs locally via `just audit-drift-check`."

