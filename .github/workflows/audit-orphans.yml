# Weekly run of every audit-* recipe that no other workflow reaches (#5001).
#
# The recipe list is DERIVED, not listed here -- scripts/audit_orphan_recipes.py
# computes it from the Justfile's dependency graph and the `just` invocations in
# these workflow files. Wire a recipe into CI and it leaves this run automatically;
# add a new one and it joins automatically. There is nothing to keep in sync.
#
# GATING (#5002): every recipe listed in `pinned` in .github/audit_orphans_pinned.toml
# gates the job -- a pinned recipe that does not PASS, including one that never ran,
# fails it. Every other orphan still runs and is recorded in the job summary, but is not
# gated. An orphan in neither `pinned` nor `[skipped]` is reported as UNCLASSIFIED.
#
# BUDGETS (#5710): `[timeouts]` in the pin file gives per-recipe budgets in seconds
# (default 900). The recipe loop stops starting work 85 minutes after its step begins,
# so the job-level `timeout-minutes: 90` cannot cancel the step before the Gate step runs.
# A recipe that has no time left is recorded FAIL, never PASS.
#
# SKIPS (#5710): `[skipped]` in the pin file names orphans that need a tool the runner
# may lack (praxia). They are recorded as SKIP, never PASS, unless `command -v praxia`
# succeeds on the runner, in which case they run and are recorded like any other orphan.
#
# Read the run's job summary for the unpinned recipes' results.
name: Audit Orphans

on:
  schedule:
    # Monday 07:30 UTC, an hour after audit-judgment.yml so the two do not contend.
    - cron: "30 7 * * 1"
  workflow_dispatch:

jobs:
  audit-orphans:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.13"

      - name: Install just
        run: uv tool install rust-just

      # Same extras as ci.yml's test job: audit-test-rigor-gate runs the whole suite, and
      # tests/eda needs matplotlib (the eda extra) to collect at all (#5002).
      - name: Install dev dependencies
        run: uv sync --extra dev --extra eda --extra io

      - name: Enumerate unreached recipes
        id: enumerate
        run: uv run python scripts/audit_orphan_recipes.py --format report

      - name: Run each unreached recipe
        run: |
          set -uo pipefail

          # Absolute deadline for the recipe loop (#5710 review). The job is capped at 90
          # minutes; no recipe starts after 85 minutes, so the Gate step always reports.
          deadline=$((SECONDS + 85 * 60))

          uv run python scripts/audit_orphan_recipes.py --format lines > /tmp/orphans.txt
          uv run python scripts/audit_orphan_recipes.py --format skipped > /tmp/orphans-skipped.tsv

          # [skipped] recipes run only if the tool they need is on the runner (#5710).
          if command -v praxia >/dev/null 2>&1; then
            echo "praxia is on the runner: running the [skipped] recipes too" >&2
            cut -f1 /tmp/orphans-skipped.tsv >> /tmp/orphans.txt
            : > /tmp/orphans-skipped.tsv
          fi

          total=$(wc -l < /tmp/orphans.txt)
          skipped_total=$(wc -l < /tmp/orphans-skipped.tsv)

          {
            echo "## Unreached audit recipes"
            echo
            echo "\`$total\` recipes to run that no workflow invokes. Only recipes pinned in"
            echo "\`.github/audit_orphans_pinned.toml\` gate; see the gate step (#5002)."
            echo "Recipes in its \`[skipped]\` table are recorded as SKIP and not run (#5710)."
            echo
            echo "| recipe | result | seconds |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          passed=0
          failed=0
          skipped=0

          # Skipped recipes are recorded, never run, and never PASS.
          while IFS=$'\t' read -r recipe reason; do
            [ -n "$recipe" ] || continue
            skipped=$((skipped + 1))
            echo "| \`$recipe\` | SKIP: $reason | 0 |" >> "$GITHUB_STEP_SUMMARY"
            printf '%s\tSKIP\n' "$recipe" >> /tmp/orphan-results.tsv
          done < /tmp/orphans-skipped.tsv

          while read -r recipe; do
            [ -n "$recipe" ] || continue

            # Restore the canonical environment before every recipe. Not hygiene
            # theatre: audit-docs-build is in this very list and is known to strip
            # beartype out of the shared venv (see the comment above
            # audit-docs-build-contract in the Justfile). Without this line, every
            # recipe sequenced after it would fail on an unrelated ImportError and
            # the whole report would be noise.
            uv sync --extra dev --extra eda --extra io --quiet

            # Per-recipe budget from [timeouts] in the pin file (default 900 s). Read per
            # recipe so a malformed file fails here, loudly.
            budget=$(uv run python scripts/audit_orphan_recipes.py --timeout-for "$recipe") || exit 1

            remaining=$((deadline - SECONDS))
            start=$SECONDS
            if [ "$remaining" -lt 1 ]; then
              result="FAIL (not run: 85-minute step deadline reached)"
              failed=$((failed + 1))
              echo "not run: the 85-minute step deadline was reached before this recipe" \
                > "/tmp/${recipe}.log"
            else
              # Clamp to the time left: `timeout 0` would mean no timeout at all.
              if [ "$budget" -gt "$remaining" ]; then
                budget=$remaining
              fi
              if timeout "$budget" just "$recipe" < /dev/null > "/tmp/${recipe}.log" 2>&1; then
                result="PASS"
                passed=$((passed + 1))
              else
                status=$?
                result="FAIL (exit $status)"
                failed=$((failed + 1))
              fi
            fi
            elapsed=$((SECONDS - start))

            echo "| \`$recipe\` | $result | ${elapsed} |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$result" = "PASS" ]; then
              printf '%s\tPASS\n' "$recipe" >> /tmp/orphan-results.tsv
            else
              printf '%s\tFAIL\n' "$recipe" >> /tmp/orphan-results.tsv
            fi

            echo "::group::$recipe -- $result"
            tail -80 "/tmp/${recipe}.log"
            echo "::endgroup::"
          done < /tmp/orphans.txt

          {
            echo
            echo "**$passed passed, $failed failed, $skipped skipped** of $((total + skipped_total))."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "$passed passed, $failed failed, $skipped skipped of $((total + skipped_total))"

      - name: Gate on the pinned passing set (#5002)
        run: |
          # No pipefail: under GitHub's `bash -e` it would abort before the summary is
          # written. PIPESTATUS[0] carries the gate's own exit code instead.
          uv run python scripts/audit_orphan_recipes.py --check-results /tmp/orphan-results.tsv 2>&1 \
            | tee /tmp/orphan-gate.txt
          status=${PIPESTATUS[0]}
          {
            echo
            echo "### Pinned-set gate"
            echo '```'
            cat /tmp/orphan-gate.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload recipe logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orphan-recipe-logs
          path: /tmp/*.log
          if-no-files-found: warn
          retention-days: 30
