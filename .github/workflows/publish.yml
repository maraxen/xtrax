name: Publish Release

# Tag pushes publish to PyPI via OIDC Trusted Publishing (no staging index by decision 2026-07-02).
# workflow_dispatch runs build + verify only (no upload).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.13"

      - name: Build distribution
        run: uv build

      - name: Check distribution metadata
        run: uv run --with twine twine check dist/*

      - name: Wheel smoke test
        run: |
          uv venv /tmp/wheel-smoke
          uv pip install --python /tmp/wheel-smoke/bin/python dist/*.whl
          /tmp/wheel-smoke/bin/python -c "import xtrax; print(xtrax.__version__)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: [build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/xtrax
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
