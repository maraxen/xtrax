name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  port-changes:
    runs-on: ubuntu-latest
    outputs:
      port: ${{ steps.filter.outputs.port }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            port:
              - 'src/xtrax/**'
              - 'port/**'
              - 'tests/contract/test_port_emit_schema.py'
              - 'scripts/audit_port_trace_count.py'
              - 'scripts/audit_port_oracle_seal.py'
              - 'Justfile'

  controller-changes:
    runs-on: ubuntu-latest
    outputs:
      controller: ${{ steps.filter.outputs.controller }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            controller:
              - 'src/xtrax/**'
              - 'controller/**'
              - 'pyproject.toml'
              - 'Justfile'

  audit-deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.13"

      - name: Install just
        run: uv tool install rust-just

      - name: Install dev dependencies
        run: uv sync --extra dev --extra io

      - name: Deterministic audit track
        run: just audit-deterministic

  lint-format-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.13"

      - name: Install just
        run: uv tool install rust-just

      - name: Install dependencies
        run: uv sync --extra dev --extra eda --extra io

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Format check with ruff
        run: uv run ruff format --check .

      - name: Type check with ty
        run: uv run ty check src/

      - name: Tier1 tests with coverage gate
        run: just audit-coverage-tier1

      - name: Tier2 EDA tests with coverage gate
        run: just audit-coverage-tier2

      - name: Doctest canonical import paths
        run: uv run pytest --doctest-modules src/xtrax/io/ -q

  controller-tests:
    # Deliberately NOT gated on the controller-changes path filter above, unlike
    # audit-port. controller/ imports from src/xtrax/loop/, so a src-only commit can
    # break it: the higher_is_better/compute_ratchet_decision mismatch this job was
    # added to catch lives in controller/main_loop.py but originates in a signature
    # under src/. A controller/**-only filter would have sat out the commit that
    # introduced it, which is the one shape of change this gate exists to catch.
    #
    # tier4 is its own tier rather than a widening of tier1 because the `controller`
    # extra pulls bathos and ~62 transitive packages; tier1 stays lean and this job
    # pays that cost alone.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.13"

      - name: Install just
        run: uv tool install rust-just

      - name: Install dependencies with the controller extra
        run: uv sync --extra dev --extra io --extra controller

      - name: Controller tests, types, and coverage gate
        run: just audit-coverage-tier4

  export-toolchain-tests:
    # tests/export/ runs twice on purpose: once in lint-format-type-test with no
    # toolchain at all (proving the fakes hold and xtrax.export imports on a base
    # install), and once here against real IREE.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.13"

      # A bare ubuntu-latest runner has no Vulkan ICD, so wgpu finds zero
      # adapters and every SPIR-V validation would silently skip rather than
      # fail. Measured 2026-09-01: 0 adapters before this step, 1 llvmpipe CPU
      # adapter after it. See
      # .praxia/docs/research/260901_webgpu-export-measurement-pass.md.
      - name: Install Vulkan ICD
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1

      - name: Install dependencies with the export toolchain
        run: uv sync --extra dev --extra io --extra export

      - name: Export tests against real IREE
        # A bare `pytest -q` here is exactly as green with every export test
        # skipped as with all of them run, so the "0 skips against real IREE
        # 3.11" claim this job exists to make had nothing behind it. `-rs`
        # lists the skips; the grep turns them into a failure.
        #
        # `tee` rather than a plain redirect so a genuine test failure still
        # prints its log: this step runs under bash -e, and with `> file` the
        # step would abort before anything got echoed, leaving a red job with
        # an empty log. `--color=no` keeps `^SKIPPED` matchable.
        run: |
          set +e
          set -o pipefail
          uv run pytest tests/export/ -q -rs --color=no 2>&1 | tee export_test_output.txt
          pytest_status=$?
          set -e
          if grep -qE '^SKIPPED \[[0-9]+\] ' export_test_output.txt; then
            echo "::error::export-toolchain-tests skipped at least one test."
            echo "This job exists to exercise tests/export/ against a real optional"
            echo "toolchain (IREE 3.11, safetensors, huggingface_hub). Every skip in"
            echo "here is an importorskip, so a skip means one of those did not"
            echo "install and this job's 'tested for real' claim is void for the"
            echo "tests below -- it is not a pass."
            grep -E '^SKIPPED \[[0-9]+\] ' export_test_output.txt
            exit 1
          fi
          exit "$pytest_status"

  # The `export-runtime` extra exists so a downstream consumer that only LOADS
  # AND RUNS an artifact does not have to install iree-base-compiler (349 MB
  # installed, against ~7 MB for the runtime). Nothing else in CI installs that
  # extra alone: lint-format-type-test installs no export extra at all, and
  # export-toolchain-tests installs the full `export`. So without this job the
  # split's entire advertised benefit is an unenforced claim in a CHANGELOG --
  # which is the failure class the rest of this sprint exists to remove.
  export-runtime-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.13"

      - name: Install the runtime extra alone
        run: uv sync --extra export-runtime

      - name: The runtime is present and the compiler is absent
        run: |
          uv run --no-sync python - <<'PY'
          import importlib.util as u
          import sys

          runtime = u.find_spec("iree.runtime")
          compiler = u.find_spec("iree.compiler")
          failures = []
          if runtime is None:
              failures.append(
                  "iree.runtime is NOT importable under [export-runtime]; the extra "
                  "does not deliver what a consumer needs to execute an artifact."
              )
          if compiler is not None:
              failures.append(
                  "iree.compiler IS importable under [export-runtime]; the split is "
                  "not actually saving the consumer the 349 MB compiler, so the "
                  "CHANGELOG's claim for this extra is false."
              )
          # xtrax.export must import with no compiler present -- its toolchain
          # imports are lazy, and a module-scope `iree` import anywhere under
          # src/xtrax/export/ would break every runtime-only consumer.
          try:
              import xtrax.export  # noqa: F401
              from xtrax.export.compile import run_native_vmfb  # noqa: F401
          except Exception as exc:  # noqa: BLE001
              failures.append(f"xtrax.export failed to import without the compiler: {exc!r}")

          if failures:
              for f in failures:
                  print(f"::error::{f}")
              sys.exit(1)
          print("export-runtime delivers iree.runtime, omits iree.compiler, "
                "and xtrax.export imports cleanly.")
          PY

  audit-port:
    needs: port-changes
    if: needs.port-changes.outputs.port == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.13"

      - name: Install just
        run: uv tool install rust-just

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: Port validation gates
        run: just audit-port

  wheel-smoke:
    needs: [port-changes, controller-changes]
    if: needs.port-changes.outputs.port == 'true' || needs.controller-changes.outputs.controller == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.13"

      - name: Build wheel (no dev extra)
        run: |
          # No dev extra, per this step's name: since #4969 the default `dev`
          # group is an alias of the 15-package dev extra, so without
          # --no-default-groups a plain `uv sync` would install beartype,
          # libcst, jaxlint, chex and the rest that this job does not want.
          uv sync --no-default-groups
          uv build

      - name: Assert port/ and controller/ absent from wheel
        run: |
          python - <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          wheels = sorted(Path("dist").glob("*.whl"))
          if not wheels:
              raise SystemExit("no wheel found in dist/")
          wheel = wheels[0]
          with zipfile.ZipFile(wheel) as zf:
              port_entries = [name for name in zf.namelist() if name.startswith("port/")]
              controller_entries = [name for name in zf.namelist() if name.startswith("controller/")]
          if port_entries:
              print("port/ must not ship in wheel:", file=sys.stderr)
              for entry in port_entries[:20]:
                  print(f"  {entry}", file=sys.stderr)
              raise SystemExit(1)
          if controller_entries:
              print("controller/ must not ship in wheel:", file=sys.stderr)
              for entry in controller_entries[:20]:
                  print(f"  {entry}", file=sys.stderr)
              raise SystemExit(1)
          print(f"wheel-smoke OK: {wheel.name} has no port/ or controller/ entries")
          PY
