name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  port-changes:
    runs-on: ubuntu-latest
    outputs:
      port: ${{ steps.filter.outputs.port }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            port:
              - 'src/xtrax/**'
              - 'port/**'
              - 'tests/contract/test_port_emit_schema.py'
              - 'scripts/audit_port_trace_count.py'
              - 'scripts/audit_port_oracle_seal.py'
              - 'Justfile'

  lint-format-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Format check with ruff
        run: uv run ruff format --check .

      - name: Type check with ty
        run: uv run ty check src/

      - name: Test with coverage gate
        run: uv run pytest --cov=xtrax --cov-branch --cov-fail-under=90

      - name: Doctest canonical import paths
        run: uv run pytest --doctest-modules src/xtrax/io/ -q

  audit-port:
    needs: port-changes
    if: needs.port-changes.outputs.port == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: Port validation gates
        run: just audit-port

  wheel-smoke:
    needs: port-changes
    if: needs.port-changes.outputs.port == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.13"

      - name: Build wheel (no dev extra)
        run: |
          uv sync
          uv build

      - name: Assert port/ absent from wheel
        run: |
          python - <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          wheels = sorted(Path("dist").glob("*.whl"))
          if not wheels:
              raise SystemExit("no wheel found in dist/")
          wheel = wheels[0]
          with zipfile.ZipFile(wheel) as zf:
              port_entries = [name for name in zf.namelist() if name.startswith("port/")]
          if port_entries:
              print("port/ must not ship in wheel:", file=sys.stderr)
              for entry in port_entries[:20]:
                  print(f"  {entry}", file=sys.stderr)
              raise SystemExit(1)
          print(f"wheel-smoke OK: {wheel.name} has no port/ entries")
          PY
