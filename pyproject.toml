[project]
name = "xtrax"
dynamic = [ "version",]
description = "High-performance composable JAX library"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [ "jax>=0.10.2,<0.12", "jaxlib>=0.10.2,<0.12", "equinox>=0.11.0", "optax>=0.2.3", "orbax-checkpoint>=0.6.0", "grain>=0.2.0", "numpy>=1.26", "pytest-asyncio>=0.23",]
license = "Apache-2.0"
keywords = [ "jax", "equinox", "training", "sparse", "distributed",]
classifiers = [ "Development Status :: 3 - Alpha", "Programming Language :: Python :: 3.13", "Intended Audience :: Science/Research", "License :: OSI Approved :: Apache Software License", "Typing :: Typed",]
[[project.authors]]
name = "Marielle Russo"
email = "67157875+maraxen@users.noreply.github.com"

[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
 "complexipy>=5.6.1",
 "import-linter>=2.1",
 "pytest-benchmark>=5.2.3",
 "pytest-cov>=7.1.0",
 "ruff>=0.15.22",
 "ty>=0.0.60",
 "tyro>=0.9,<2",
]
docs = [ "sphinx>=7", "furo", "sphinx-autodoc-typehints", "myst-parser",]
eda = [ "pandas>=2.0", "matplotlib>=3.8", "seaborn>=0.13",]

[project.optional-dependencies]
dev = [
 "complexipy>=5.6.1",
 "pytest>=8.0",
 "pytest-asyncio>=0.23",
 "pytest-cov>=5.0",
 "pytest-benchmark>=4.0",
 "ruff>=0.4.0",
 "ty",
 "jaxtyping>=0.2.28",
 "beartype>=0.18.0",
 "libcst>=1.5.0",
 "import-linter>=2.1",
 "jaxlint>=0.1.0a1",
 "chex>=0.1.86",
 "interrogate>=1.7.0",
 "pyyaml>=6.0",
]
eda = [ "pandas>=2.0", "matplotlib>=3.8", "seaborn>=0.13",]
cli = [ "tyro>=0.9,<2", "flatbuffers>=2",]
io = [ "zarr>=3.0",]
# NOTE: there is deliberately no `provenance = ["cisternal"]` extra yet.
#
# xtrax.telemetry uses cisternal.provenance (durable per-run git refs, dirty-tree
# worktree snapshots) when it is importable, via a guarded import in
# src/xtrax/telemetry/record.py, and degrades to git shellouts otherwise --
# recording provenance_source="builtin" so the difference is never invisible.
# That upgrade path needs no dependency declaration to work.
#
# Declaring the extra anyway was tried and reverted (2026-08-28). cisternal pins
# `fastmcp==4.0.0a2`, an exact PRE-RELEASE, as a hard runtime dependency. uv
# resolves every extra when building the lock, so merely declaring an optional
# cisternal extra makes xtrax unresolvable without `--prerelease=allow` -- for
# all users, including those who never ask for provenance. An optional extra
# that breaks the default install is not optional.
#
# Users who want durable provenance today install cisternal themselves. Add the
# extra once cisternal moves fastmcp/cyclopts behind its own extras;
# cisternal.provenance is pure stdlib, so nothing about that module requires
# them.
authoring-smoke = [ "outlines>=1.0", "transformers>=4.40", "torch>=2.0",]
controller = [ "bathos>=0.13.0a1",]

[project.scripts]
xtrax = "xtrax.cli:main"

[project.urls]
Homepage = "https://github.com/maraxen/xtrax"
Documentation = "https://xtrax.readthedocs.io"
Repository = "https://github.com/maraxen/xtrax"
Issues = "https://github.com/maraxen/xtrax/issues"
Changelog = "https://github.com/maraxen/xtrax/blob/main/CHANGELOG.md"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.hatch.version]
path = "src/xtrax/__init__.py"

[tool.pytest.ini_options]
testpaths = [ "tests", "benchmarks",]
python_files = [ "test_*.py", "*_test.py", "bench_*.py",]
asyncio_mode = "auto"
addopts = "--cov=xtrax --cov-report=term-missing --cov-report=html:.coverage_html --cov-branch"

[tool.coverage.run]
source = [ "xtrax",]
branch = true
omit = [ "*/tests/*", "*/__init__.py", "xtrax/devtools/*",]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "S110"] # includes S110 (try-except-pass), added 260827

[tool.ruff.lint.per-file-ignores]
# jaxtyping shape strings use forward refs and undefined names in annotations
"tests/**/*.py" = ["F722", "F821"]
"tests/eda/test_render.py" = ["E402", "F841"]
"tests/eda/test_render_errors.py" = ["E402"]
"port/reference/**/*.py" = ["UP047"]

[tool.jaxlint]
# N0.4 foundation: performance sensors gate via `just audit-jaxlint` (--no-doc).
# Documentation rules (JD/JM) ratchet in audit-fw N2+ waves.
ignore = []

[tool.importlinter]
root_package = "xtrax"

[[tool.importlinter.contracts]]
name = "Core packages must not import EDA (optional extra)"
type = "forbidden"
# xtrax.cli may import eda lazily (cli extra); intentionally not a forbidden source
source_modules = [
  "xtrax.transforms",
  "xtrax.tiling",
  "xtrax.stages",
  "xtrax.run",
  "xtrax.training",
  "xtrax.engine",
  "xtrax.data",
  "xtrax.distributed",
  "xtrax.safety",
  "xtrax.checkpoint",
  "xtrax.io",
  "xtrax.sparse",
  "xtrax.inference",
  "xtrax.loop",
  "xtrax.telemetry",
]
forbidden_modules = ["xtrax.eda"]

[[tool.importlinter.contracts]]
name = "Shipped packages must not import xtrax.devtools (unshipped dev-only tree)"
type = "forbidden"
# Regression guard: xtrax.run.repro_floor and three loop gates briefly
# imported xtrax.devtools.freshness while the wheel excludes devtools --
# breaking every downstream install (found by aminx dogfood smoke, 2026-08-25).
# Exhaustive over shipped units: modules AND subpackages, including the
# top-level primitives this PR itself relocated (findings/jaxlint_runner/
# tombstone) -- a partial list let a devtools import slip through in
# findings.py during review (juror repro).
source_modules = [
  "xtrax.transforms",
  "xtrax.tiling",
  "xtrax.stages",
  "xtrax.run",
  "xtrax.training",
  "xtrax.engine",
  "xtrax.data",
  "xtrax.distributed",
  "xtrax.safety",
  "xtrax.checkpoint",
  "xtrax.io",
  "xtrax.sparse",
  "xtrax.inference",
  "xtrax.loop",
  "xtrax.profiling",
  "xtrax.cli",
  "xtrax.composition",
  "xtrax.eda",
  "xtrax.config",
  "xtrax.findings",
  "xtrax.jaxlint_runner",
  "xtrax.tombstone",
  "xtrax.telemetry",
]
forbidden_modules = ["xtrax.devtools"]

[[tool.importlinter.contracts]]
name = "tiling must not import inference"
type = "forbidden"
source_modules = ["xtrax.tiling"]
forbidden_modules = ["xtrax.inference"]

[tool.port]
target = "port/port_target.toml"

[tool.hatch.build.targets.wheel]
# port/ is dev-only (Epic #2180); only src/xtrax ships in the wheel.
packages = [ "src/xtrax",]
exclude = [ "src/xtrax/devtools",]

[tool.hatch.build.targets.wheel.force-include]
"src/xtrax/py.typed" = "xtrax/py.typed"
"src/xtrax/composition/node_metadata_schema.toml" = "xtrax/composition/node_metadata_schema.toml"

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["src/**/*.py"]
