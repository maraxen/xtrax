[project]
name = "xtrax"
version = "0.1.0"
description = "High-performance composable JAX library"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jax>=0.4.36",
    "jaxlib>=0.4.36",
    "equinox>=0.11.0",
    "optax>=0.2.3",
    "orbax-checkpoint>=0.6.0",
    "grain>=0.2.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4.0",
    "pyright>=1.1.360",
    "jaxtyping>=0.2.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xtrax"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
