[project]
name = "xtrax"
dynamic = ["version"]
description = "High-performance composable JAX library"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jax>=0.4.36",
    "jaxlib>=0.4.36",
    "equinox>=0.11.0",
    "optax>=0.2.3",
    "orbax-checkpoint>=0.6.0",
    "grain>=0.2.0",
    "numpy>=1.26",
    "pytest-asyncio>=0.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-benchmark>=4.0",
    "ruff>=0.4.0",
    "pyright>=1.1.360",
    "jaxtyping>=0.2.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/xtrax/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/xtrax"]

[tool.pytest.ini_options]
testpaths = ["tests", "benchmarks"]
python_files = ["test_*.py", "*_test.py", "bench_*.py"]
asyncio_mode = "auto"
addopts = "--cov=xtrax --cov-report=term-missing --cov-report=html:.coverage_html --cov-branch"

[tool.coverage.run]
source = ["xtrax"]
branch = true
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[dependency-groups]
dev = [
    "pytest-benchmark>=5.2.3",
    "pytest-cov>=7.1.0",
]
