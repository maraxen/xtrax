# Judgment-track dimension → agent roster (audit-fw spec 260611 / N4.1 #1590).
# Each row arms one dimension for scheduled observation emit via run_judgment_dispatch.

[dispatch]
schema_version = 1
version = "0.1.0"

[[dimensions]]
dimension = "correctness"
agent_role = "oracle"
rubric_path = "audit/rubrics/correctness.toml"
default_severity = "info"
label = "observation"

