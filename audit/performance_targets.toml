[gate]
schema = "performance-gate-v0"
version = "0.1.0"
max_traces_default = 1

# Optional per-probe dispatch ceilings (opt-in; absent = not checked):
#   max_compilations  steady-state compiles per unit (steady units: 0)
#   max_jit_traces    Python-level jit trace events in the probed window
#   max_executions    XLA executions in the probed window, per kernel. There is
#                     deliberately no global absolute count: a per-kernel ceiling
#                     is the only form (spec 261016 X5).
# The shared dispatch-ratio rule (executions / cardinality) lives in
# xtrax.profiling.rules; it is not a per-probe setting here.
[[probes]]
qualname = "xtrax.devtools.gates._performance_probes.sparse_filter_jit_kernel"
max_traces = 1
trace_probe = "xtrax.devtools.gates._performance_probes:probe_sparse_filter_jit_kernel"
