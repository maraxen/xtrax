# CC5 severity×track routing matrix (audit-fw spec 260611).
# Maps (domain, track, severity, signal/condition) → disposition destination.
#
# P5-ROUTE (port_validation PCW) applies domain=port rows after P4-EMIT and writes
# supervisor decision artifacts to:
#   .praxia/port/routing/<wave_id>_<finding_id>.toml
#
# domain=port rows: OWNED by the port_validation workflow (epic #2180, TD-2180-03).
# Adopted 2026-09-30 after verification -- no longer "proposed interim defaults".
# A deterministic tier FAIL -> block_ci is enforced by the audit-port CI job
# (just audit-port -> pytest port/tests/), not by code reading this file; that
# chain is pinned by tests/audit/test_port_block_ci_wiring.py. Changing a
# domain=port row means updating that test and port/docs/workflow.md with it.

[matrix]
schema = "cc5-routing-v0"
version = "0.2.0"

# --- domain=port (implementation validation / parity wave) ---

[[routes]]
domain = "port"
track = "deterministic"
severity = "major"
signal = "tier_verdict.status"
condition = "FAIL"
destination = "block_ci"

[[routes]]
domain = "port"
track = "deterministic"
severity = "major"
signal = "tier_verdict.status"
condition = "FAIL"
destination = "backlog_node"
notes = "P5-ROUTE when repair_cycles exhausted or human_escalation_reason is set"

[[routes]]
domain = "port"
track = "deterministic"
severity = "minor"
signal = "static_gate.verdict"
condition = "WARN"
destination = "found_issues"

[[routes]]
domain = "port"
track = "deterministic"
severity = "info"
signal = "label"
condition = "observation"
destination = "found_issues"

# --- domain=dimension (default track×severity matrix) ---

[[routes]]
domain = "dimension"
track = "deterministic"
severity = "critical"
destination = "block_ci"

[[routes]]
domain = "dimension"
track = "deterministic"
severity = "major"
destination = "block_ci"

[[routes]]
domain = "dimension"
track = "deterministic"
severity = "minor"
destination = "found_issues"

[[routes]]
domain = "dimension"
track = "deterministic"
severity = "info"
destination = "found_issues"

[[routes]]
domain = "dimension"
track = "judgment"
severity = "critical"
destination = "backlog_node"

[[routes]]
domain = "dimension"
track = "judgment"
severity = "major"
destination = "backlog_node"

[[routes]]
domain = "dimension"
track = "judgment"
severity = "minor"
destination = "found_issues"

[[routes]]
domain = "dimension"
track = "judgment"
severity = "info"
destination = "found_issues"
