target-version = "py313"
line-length = 100

[lint]
select = ["E", "F", "I", "UP"]

[lint.per-file-ignores]
# jaxtyping shape strings use forward refs and undefined names in annotations
"tests/**/*.py" = ["F722", "F821"]
"tests/eda/test_render.py" = ["E402", "F841"]
"tests/eda/test_render_errors.py" = ["E402"]
"port/reference/**/*.py" = ["UP047"]
