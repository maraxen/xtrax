sprint_num = 1
name = "260624_resume-verb"
description = "Implement the checkpoint resume CLI verb"
context = "Epic #2605"
max_fix_retries = 1
worktree_shadow_mode = false

[[tracks]]
id = "a"
is_research = false
worktree = false
