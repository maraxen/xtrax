import asyncio
from collections.abc import AsyncIterator, Callable, Iterable
from typing import Any, TypeVar

T = TypeVar("T")

async def async_indexed_stream(iterable: Iterable[T]) -> AsyncIterator[tuple[int, T]]:
    # Exception from iterable re-raised on next yield
    try:
        for i, item in enumerate(iterable):
            yield i, item
    except Exception:
        raise  # propagate to consumer

class BoundedCallbackHandler:
    def __init__(self, max_concurrent: int = 4) -> None:
        self._semaphore = asyncio.Semaphore(max_concurrent)
        self._tasks: list[asyncio.Task] = []

    async def submit(self, callback: Callable, *args: Any) -> None:
        async with self._semaphore:
            task = asyncio.create_task(self._run(callback, *args))
            self._tasks.append(task)

    async def _run(self, callback: Callable, *args: Any) -> None:
        if asyncio.iscoroutinefunction(callback):
            await callback(*args)
        else:
            callback(*args)

    async def wait_all(self) -> None:
        if self._tasks:
            await asyncio.gather(*self._tasks)
            self._tasks.clear()
```

