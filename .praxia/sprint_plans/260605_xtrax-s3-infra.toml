import os
from dataclasses import dataclass
from typing import Any

@dataclass
class _DistState:
    initialized: bool = False
    config: dict[str, Any] | None = None

_STATE = _DistState()

def init_dist(
    num_processes: int | None = None,
    process_id: int | None = None,
    coordinator_address: str | None = None,
) -> None:
    global _STATE
    config = {
        "num_processes": num_processes,
        "process_id": process_id,
        "coordinator_address": coordinator_address,
    }
    if _STATE.initialized:
        if _STATE.config != config:
            raise RuntimeError(
                f"init_dist: already initialized with different config. "
                f"Previous: {_STATE.config}, New: {config}"
            )
        return  # idempotent same args
    # Auto-detect SLURM environment
    if num_processes is None:
        num_processes = int(os.environ.get("SLURM_NTASKS", "1"))
    if process_id is None:
        process_id = int(os.environ.get("SLURM_PROCID", "0"))
    if num_processes == 1:
        _STATE.initialized = True
        _STATE.config = config
        return  # localhost single-process fallback
    import jax
    jax.distributed.initialize(
        coordinator_address=coordinator_address or "localhost:1234",
        num_processes=num_processes,
        process_id=process_id,
    )
    _STATE.initialized = True
    _STATE.config = config

def _reset_for_testing() -> None:
    global _STATE
    _STATE = _DistState()
```

