import re
from dataclasses import dataclass, field
from typing import Any
import jax
from jax.sharding import PartitionSpec

@dataclass
class ShardingPolicy:
    # Rules: list of (regex_pattern, PartitionSpec) pairs.
    # First match wins — order matters.
    rules: list[tuple[str, PartitionSpec]] = field(default_factory=list)

    def get_spec(self, path: str) -> PartitionSpec:
        for pattern, spec in self.rules:
            if re.search(pattern, path):
                return spec
        return PartitionSpec()  # default: replicated

def get_hardware_mesh_profile(device_type: str = "cpu") -> dict[str, Any]:
    return {
        "device_type": device_type,
        "num_devices": len(jax.devices()),
        "device_ids": [d.id for d in jax.devices()],
    }

def get_device_mesh(mesh_shape: tuple[int, ...]) -> jax.sharding.Mesh:
    devices = jax.devices()
    total = 1
    for s in mesh_shape:
        total *= s
    if total != len(devices):
        raise ValueError(
            f"get_device_mesh: mesh_shape product={total} != num_devices={len(devices)}"
        )
    import numpy as np
    return jax.sharding.Mesh(np.array(devices).reshape(mesh_shape), axis_names=tuple(f"d{i}" for i in range(len(mesh_shape))))
```

