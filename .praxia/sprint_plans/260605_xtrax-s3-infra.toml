import asyncio
from pathlib import Path
from typing import Any
import equinox as eqx
from xtrax.training.types import Callback, ResumableState
from xtrax.training.trainer import Trainer
from xtrax.engine.io import BoundedCallbackHandler
from xtrax.checkpoint.orbax import save_checkpoint

class Engine:
    def __init__(
        self,
        trainer: Trainer,
        callbacks: list[Callback] | None = None,
        checkpoint_dir: str | Path | None = None,
        validation_callbacks: list[Callback] | None = None,
    ) -> None:
        self._trainer = trainer
        self._callbacks = callbacks or []
        self._validation_callbacks = validation_callbacks or []
        self._checkpoint_dir = checkpoint_dir
        self._handler = BoundedCallbackHandler()

    async def fit(self, state: ResumableState, data_iter: Any, num_epochs: int) -> ResumableState:
        for cb in self._callbacks:
            cb.on_train_start(state)
        for epoch in range(num_epochs):
            for cb in self._callbacks:
                cb.on_epoch_start(state, epoch)
            for batch in data_iter:
                for cb in self._callbacks:
                    cb.on_step_start(state)
                state, loss = self._trainer.step(state, batch)
                for cb in self._callbacks:
                    cb.on_step_end(state, loss)
            for cb in self._callbacks:
                cb.on_epoch_end(state, epoch)
            if self._checkpoint_dir is not None:
                save_checkpoint(state, self._checkpoint_dir)
        for cb in self._callbacks:
            cb.on_train_end(state)
        await self._handler.wait_all()
        return state

    def eval(self, state: ResumableState, data_iter: Any, metric_fns: dict) -> dict:
        # Wrap model in inference_mode for eval — disables dropout/stochastic layers
        eval_state = eqx.tree_at(lambda s: s.model, state, eqx.nn.inference_mode(state.model))
        all_metrics = {k: [] for k in metric_fns}
        for cb in self._validation_callbacks:
            cb.on_epoch_start(eval_state, 0)
        for batch in data_iter:
            predictions = eval_state.model(batch["inputs"])
            for name, fn in metric_fns.items():
                all_metrics[name].append(fn(predictions, batch["targets"]))
        for cb in self._validation_callbacks:
            cb.on_epoch_end(eval_state, 0)
        import jax.numpy as jnp
        return {k: jnp.mean(jnp.stack(v)) for k, v in all_metrics.items()}

    def fit_sync(self, state: ResumableState, data_iter: Any, num_epochs: int) -> ResumableState:
        return asyncio.run(self.fit(state, data_iter, num_epochs))
```

