from pathlib import Path
from typing import Any
import orbax.checkpoint as ocp
from xtrax.training.types import ResumableState

def save_checkpoint(state: ResumableState, checkpoint_dir: str | Path, step: int | None = None) -> None:
    # Must be called Python-side (outside JIT): int(state.step) would fail inside trace
    step_int = int(state.step)
    if step is not None:
        step_int = step
    checkpointer = ocp.CheckpointManager(str(checkpoint_dir), ocp.PyTreeCheckpointer())
    checkpointer.save(step_int, state)
    checkpointer.wait_until_finished()  # always wait — ensures durability

def load_checkpoint(checkpoint_dir: str | Path) -> ResumableState:
    checkpoint_path = Path(checkpoint_dir)
    if not checkpoint_path.exists() or not any(checkpoint_path.iterdir()):
        raise FileNotFoundError(f"No checkpoint found at {checkpoint_dir}")
    checkpointer = ocp.CheckpointManager(str(checkpoint_dir), ocp.PyTreeCheckpointer())
    step = checkpointer.latest_step()
    return checkpointer.restore(step)
```

