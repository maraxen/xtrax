## Step P1.1 -- new exception + fitness_dict field
Add a module-local `PriorBestSoFarLineageConflictError` exception to `controller/main_loop.py`.
Add `fitness_dict: dict[str, float]` as a new field on `OneCandidatePassResult` (currently lines
173-226), populated at the same point `ratchet_decision` is (the existing no-partial-construction
guarantee already covers it: an exception anywhere upstream of `guarded_evaluate_fn`'s return aborts
the whole call before any `OneCandidatePassResult` -- partial or otherwise -- is constructed).

## Step P1.2 -- signature changes
On `run_one_candidate_pass` (currently starting line ~229): change `commit_tree_sha` from required
`str` to `str | None = None`. Add `commit_tree_sha_fn: Callable[[CandidateHandoff, Path, Path, str | None], str] = compute_candidate_tree_sha`
(injection seam, matches the file's existing `guarded_evaluate_fn`/`stats_battery_fn` DI convention).
Add `candidate_target_path: Path | None = None` (NOT unconditionally required -- see P1.4's
conditional validation). Add `bootstrap_base_tree_sha: str | None = None`. Add
`allow_fresh_start_despite_existing_lineage: bool = False`. Existing literal-`commit_tree_sha` callers
(e.g. `test_main_loop.py`'s `_new_step_kwargs()`) must remain valid without any changes -- this is a
purely additive signature change.

## Step P1.3 -- compute_candidate_tree_sha real default
New module-level function `compute_candidate_tree_sha(handoff: CandidateHandoff, repo: Path, candidate_target_path: Path, base_sha: str | None) -> str`
in `controller/main_loop.py` (placement here, not `xtrax.loop/`, since that package must not import
`CandidateHandoff` from `controller/dispatch.py` -- reverse-dependency direction). `base_sha` is the
resolved base COMMIT to substitute against, explicitly NOT `commit_tree_sha` itself (this function's
own return value, never one of its inputs). If `base_sha is None`, raise `ValueError` immediately,
before any git write. Otherwise, using a scratch `GIT_INDEX_FILE` (never mutate the repo's real
index):
1. Resolve `base_sha^{tree}` (e.g. via `git rev-parse`) -- `base_sha` is a COMMIT sha, not a tree sha.
2. `git read-tree` that resolved tree into the scratch index.
3. Write the candidate's blob FIRST via `git hash-object -w <handoff.path>` to obtain a blob sha.
4. `git update-index --add --cacheinfo 100644 <blob-sha> <candidate_target_path>` (file mode 100644
   unconditionally -- executable candidates are an explicitly out-of-scope future extension).
5. `git write-tree` from the scratch index, return the resulting tree sha.
This produces a whole-repo-tree substitution (every base-tree path unchanged except
`candidate_target_path`), never a synthetic single-file tree -- required because
`reset_worktree_to_best_so_far` does a real `git reset --hard` onto this lineage, and a single-file
tree would corrupt the worktree on reject. `git update-index --add` does not distinguish "new path"
from "replace existing path" at the plumbing level, so no special-casing is needed for either case.

## Step P1.4 -- fail-fast validation
Insert, before `dispatch_backend.dispatch_candidate()` is called (currently ~line 406/407): if
`commit_tree_sha is None` AND `candidate_target_path is None`, raise `ValueError`
("candidate_target_path is required when commit_tree_sha is not supplied directly"). This lets
literal-`commit_tree_sha` call sites omit `candidate_target_path` entirely (never used on that path,
`commit_tree_sha_fn` never invoked).

## Step P1.5 -- lineage-conflict guard
Insert, inside the `best_fitness is None` branch (currently lines 469-479), BEFORE the automatic-accept
sentinel is constructed: call `read_best_so_far(repo, ratchet_ref_name)`. If it returns non-`None`
(a prior best-so-far commit already exists in git lineage despite the caller believing this is a fresh
start), raise `PriorBestSoFarLineageConflictError` naming both `ratchet_ref_name` and the conflicting
SHA in the message, AND instructing the caller to use a fresh, unique `ratchet_ref_name` per
genuinely-new campaign rather than reaching for the override flag -- unless
`allow_fresh_start_despite_existing_lineage=True`, in which case proceed with today's automatic-accept
sentinel behavior unchanged (the caller has explicitly acknowledged the conflict).

## Step P1.6 -- tree-substitution wired into the accept branch
Inside the accept branch (currently lines 487-509), immediately BEFORE `create_pending_commit` (line
~503): resolve `base_sha` via a SECOND, explicit `read_best_so_far(repo, ratchet_ref_name)` call (not
reusing `prior_best_sha` from the existing `commit_parent_sha` resolution logic -- this mirrors that
existing code's own precedent of reading twice deliberately, both side-effect-free reads). If that
returns `None`, fall back to `bootstrap_base_tree_sha`; if that is ALSO `None`,
`compute_candidate_tree_sha` (P1.3's real default) raises `ValueError` immediately.

**Placement note (already resolved by plan-audit, do not re-litigate):** `commit_tree_sha_fn` is
invoked HERE (lazily, accept-branch-only), not eagerly right after dispatch. This is deliberate:
nothing between dispatch and the accept branch reads `commit_tree_sha`, and `commit_parent_sha`'s own
existing resolution already lives in this same accept branch, not eagerly -- lazy placement avoids
wasted git-subprocess work and a spurious `bootstrap_base_tree_sha`-required failure for a candidate
that turns out to be rejected or gate-blocked before ever reaching accept. Pass the resolved `base_sha`
as `commit_tree_sha_fn`'s 4th arg; its return value replaces the `commit_tree_sha` argument passed to
`create_pending_commit`.

## Step P1.7 -- tests
Add to `tests/controller/test_main_loop.py`:
1. `candidate_target_path` validation: literal `commit_tree_sha` + omitted `candidate_target_path`
   succeeds, `commit_tree_sha_fn` never invoked (spy); omitting both raises `ValueError` immediately.
2. `compute_candidate_tree_sha` signature test (`inspect.signature`, exactly 4 named params `handoff`,
   `repo`, `candidate_target_path`, `base_sha` in that order) + plumbing test (fixture repo + known base
   commit + candidate file: resolves `base_sha^{tree}` before `read-tree`, writes blob before
   `update-index`, `git ls-tree -r` shows mode `100644`) + a new-path-not-just-replacement test
   (`candidate_target_path` absent from the base tree -- asserts it appears correctly in the result,
   alongside every pre-existing base-tree path unchanged).
3. `PriorBestSoFarLineageConflictError` both branches (raises naming ref+sha+guidance by default;
   `allow_fresh_start_despite_existing_lineage=True` proceeds unchanged).
4. `fitness_dict` byte-identical round-trip from `guarded_evaluate_fn`'s return value, PLUS an explicit
   no-partial-construction test (patch `guarded_evaluate_fn` to raise mid-call, assert no
   `OneCandidatePassResult` -- partial or otherwise -- is ever constructed).
5. **Lock-in test for P1.6's lazy placement** (required by plan-audit): prove `compute_candidate_tree_sha`
   / `commit_tree_sha_fn` is NEVER invoked for a candidate that is rejected, gate-blocked, or aborts via
   a `guarded_evaluate_fn` exception before reaching the accept branch (spy assertion).

VERIFY before finishing: `uv run --extra dev --extra cli --extra io pytest tests/controller/test_main_loop.py -v`
fully green, no pre-existing test weakened. Commit with a descriptive conventional-commit message
(e.g. `feat(controller): add fitness_dict, commit_tree_sha_fn, lineage-conflict guard to
run_one_candidate_pass (#4203)`) once tests pass.
"""
