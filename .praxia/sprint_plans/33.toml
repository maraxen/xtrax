- SparsePolicy.make_mask: argsort-based, returns exactly nse_budget True values
- BCOO registration: jax.experimental.sparse.BCOO is a registered JAX pytree
  → tree_flatten without is_leaf splits BCOO into data+indices arrays
  → MUST use is_leaf=lambda x: isinstance(x, BCOO) to treat BCOO as atomic
- apply_mask 2D constraint: indices[:, 0], indices[:, 1] → ndim==2 required
