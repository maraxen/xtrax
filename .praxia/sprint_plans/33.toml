  - __init__ validating len(batch_sizes) == len(boundaries) + 1
  - fields: boundaries: list[int], batch_sizes: list[int], fn: Callable, xs: Any
  - __iter__ stub at line 121: yields nothing (yield from [])

Design intent:
- boundaries define static bucket sizes (e.g. [128, 256, 512])
- batch_sizes[i] is the batch size for bucket i (len(boundaries)+1 entries)
- For a given input, find the SMALLEST bucket whose boundary >= seq_len; pad up to that boundary
- Yield (result, original_length_mask) so caller can trim padding
- Static bucket sizes prevent XLA recompilation on length variation
- bucket_idx >= len(boundaries) means input exceeds ALL buckets: raise ValueError
- EXACT boundary (seq_len == boundary) IS valid: pad_amount==0, no error

=== TASK ===
Add these imports to the TOP-LEVEL of src/xtrax/tiling/iterator.py (NOT inline in __iter__):
  import bisect
  import warnings
  (jax and jax.numpy are already imported at the top of the file — do NOT re-import them)

Replace the __iter__ stub in src/xtrax/tiling/iterator.py with:

def __iter__(self):
    leaves = jax.tree_util.tree_leaves(self.xs)
    if not leaves:
        return

    seq_len = leaves[0].shape[0]
    # bisect_left finds the first boundary >= seq_len (exact match is valid, pad_amount=0)
    bucket_idx = bisect.bisect_left(self.boundaries, seq_len)

    if bucket_idx >= len(self.boundaries):
        max_bucket = self.boundaries[-1]
        warnings.warn(
            f"BucketIterator: input length {seq_len} exceeds maximum bucket size {max_bucket}; "
            "this input cannot be processed without recompilation risk",
            stacklevel=2,
        )
        raise ValueError(
            f"Input length {seq_len} exceeds maximum bucket size {max_bucket}. "
            "Add a larger boundary or use a different iterator."
        )

    bucket_size = self.boundaries[bucket_idx]
    pad_amount = bucket_size - seq_len

    padded_xs = jax.tree_util.tree_map(
        lambda x: jnp.pad(x, [(0, pad_amount)] + [(0, 0)] * (x.ndim - 1)),
        self.xs,
    )

    original_length_mask = jnp.arange(bucket_size) < seq_len
    result = self.fn(padded_xs)
    yield (result, original_length_mask)

