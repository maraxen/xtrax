=== TASK ===
Create src/xtrax/sparse/inference.py with:

1. assert_not_tracing(leaves: list) -> None
   - Iterate leaves; if any isinstance(leaf, jax.core.Tracer), raise RuntimeError:
     "sparsify_model cannot be called inside jax.jit — call it before jit compilation"

2. sparsify_model(model: eqx.Module, policy: SparsePolicy, leaf_filter=eqx.is_array) -> eqx.Module
   - leaves, treedef = jax.tree_util.tree_flatten(model, is_leaf=lambda x: isinstance(x, BCOO))
   - assert_not_tracing(leaves)
   - Guard: if any(isinstance(leaf, BCOO) for leaf in leaves): raise ValueError("model already contains BCOO leaves — double sparsification detected")
   - For each leaf (leaf_filter is the OUTER inclusion gate; ndim==2 is the inner sparsification gate):
     * If NOT leaf_filter(leaf): new_leaf = leaf  (excluded entirely; no warning)
     * Elif leaf_filter(leaf) and hasattr(leaf, "ndim") and leaf.ndim == 2:
         mask = policy.make_mask(leaf, step=0)
         new_leaf = policy.apply_mask(leaf, mask)
     * Elif leaf_filter(leaf) and hasattr(leaf, "ndim") and leaf.ndim != 2:
         warnings.warn(f"sparsify_model: skipping non-2D leaf (ndim={leaf.ndim}) — apply_mask requires 2D weights; leaf preserved as dense", stacklevel=2)
         new_leaf = leaf
     * Else: new_leaf = leaf
   - return jax.tree_util.tree_unflatten(treedef, new_leaves)

3. make_sparse_forward_fn(fn: Callable, sparse_model: eqx.Module) -> Callable
   - Returns def _forward(inputs): return fn(sparse_model, inputs)
   - IMPORTANT: Add this comment in the implementation body:
     # Closing over sparse_model keeps BCOO leaves out of eqx.filter_jit's is_array
     # partition. BCOO is not a jax.Array — passed as an argument it would be
     # destructured into data+indices; as a closure constant it is treated as static.
     # This is the load-bearing mechanism for AC-6 (no-retrace guarantee).
   - Purpose: the closure pattern prevents filter_jit from re-partitioning BCOO on each call.

