test_no_retrace_across_calls():
    import jax
    from xtrax.sparse.inference import sparsify_model, make_sparse_forward_fn
    from xtrax.sparse.policy import SparsePolicy
    from xtrax.sparse.config import SparseConfig
    import equinox as eqx

    key = jax.random.PRNGKey(0)
    model = eqx.nn.Linear(8, 8, key=key)
    config = SparseConfig(nse_budget=32)
    policy = SparsePolicy(config=config)

    sparse_model = sparsify_model(model, policy)
    fn = make_sparse_forward_fn(lambda m, x: m(x), sparse_model)

    # Python-side mutation inside eqx.filter_jit only executes during tracing,
    # not on cached compiled dispatch — this is a reliable retrace detector.
    # counter > 1 means assumption A1 (BCOO static closure prevents retrace) is FALSE.
    call_count = {"n": 0}
    @eqx.filter_jit
    def forward(x):
        call_count["n"] += 1
        return fn(x)

    x = jax.numpy.ones((8,))
    out1 = forward(x)
    out2 = forward(x)
    out3 = forward(x)

    # call_count["n"] should be 1 (traced once) — Python-side counter only increments on trace
    # NOTE: eqx.filter_jit traces on first call; subsequent calls with same shape skip trace
    assert call_count["n"] == 1, f"Expected 1 trace, got {call_count['n']} — retrace detected"
    assert out1.shape == out2.shape == out3.shape

test_engine_eval_with_sparse_model():
    # Verify sparsify_model output survives eqx.nn.inference_mode without error
    # This tests AC-9: composition with Engine.eval pattern
    import jax
    import equinox as eqx
    from xtrax.sparse.inference import sparsify_model
    from xtrax.sparse.policy import SparsePolicy
    from xtrax.sparse.config import SparseConfig

    key = jax.random.PRNGKey(42)
    model = eqx.nn.Linear(4, 4, key=key)
    config = SparseConfig(nse_budget=8)
    policy = SparsePolicy(config=config)

    sparse_model = sparsify_model(model, policy)

    # Apply inference_mode (same as Engine.eval does at line 169)
    inference_model = eqx.nn.inference_mode(sparse_model)

    # Verify BCOO leaves survive the transformation
    import jax.numpy as jnp
    from jax.experimental.sparse import BCOO
    leaves = jax.tree_util.tree_leaves(inference_model, is_leaf=lambda x: isinstance(x, BCOO))
    assert any(isinstance(leaf, BCOO) for leaf in leaves), "BCOO leaves lost after inference_mode"

    # Run a forward pass
    x = jnp.ones((4,))
    @eqx.filter_jit
    def forward(m, x):
        return m(x)

    out = forward(inference_model, x)
    assert out.shape == (4,), f"Expected (4,), got {out.shape}"

