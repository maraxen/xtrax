## Steps
1. Add `.praxia/composition/node_metadata_schema.toml` with `[schema] version/schema_version` and `[[slots]]` entries:
   - required: `nl_description` (type string, min_length 1)
   - optional: `mathjax_label` (string), `citations` (array of {doi|url|text}), `script_usage` (object with language + excerpt),
     `audit_verdict` (enum PASS|FAIL|NEEDS_WORK), `bathos_sidecar_ref` (string path relative to repo root)
2. Extend `scripts/load_capability_registry.py`:
   - Add `load_node_metadata_schema()` and/or integrate into `load_capability_registry()` return type
   - Validate required/optional slot names in capability_registry `[node_metadata]` match schema slot ids exactly
   - Validate unknown slot types rejected; semver on schema version
3. Add `tests/composition/test_node_metadata_schema.py`:
   - Schema loads; required slot `nl_description` enforced
   - Sample valid node metadata dict passes validation; missing required fails; unknown slot fails
   - Registry slot list matches schema slot ids (no drift vs capability_registry.toml)
4. Add `just validate-node-metadata-schema` (may call extended loader); keep `just validate-capability-registry` green
5. Run `uv run pytest tests/composition/ -v` and `uv run ruff check scripts/load_capability_registry.py`

Composition layer only — no changes under `src/xtrax/` core package.

## Commit
Do NOT commit locally. Orchestrator commits after reviewer PASS with message:
`feat(composition): graph node metadata schema + loader validation (#2177)`
"""
