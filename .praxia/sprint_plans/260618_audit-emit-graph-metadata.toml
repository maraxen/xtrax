workflow_hint = "refactor_with_audit"
fixer_prompt = """
task_id: 260617_xtrax-composition-mission
Backlog: #1577 [audit-fw N1.1] audit emit envelope + 2 constructors + contract test

Spec: .praxia/docs/specs/260611_re-run-v2-refine-and-enrich-the-xtrax-sy.md (contract-tested emit envelope)
Reference (unmerged worktree): .claude/worktrees/xtrax-audit-framework/.praxia/docs/specs/260611_xtrax-audit-framework.md §3.1, §7, AC-1.1

## File anchors
- src/xtrax/devtools/__init__.py (new package marker)
- src/xtrax/devtools/emit.py (single envelope + constructors)
- tests/audit/test_emit_contract.py (merge-blocking contract test)
- pyproject.toml ([tool.hatch.build.targets.wheel] exclude devtools from wheel; [tool.coverage.run] omit xtrax.devtools)
- Justfile (`just audit-emit-contract` recipe)

## Steps
1. Create `src/xtrax/devtools/` package (`__init__.py`); keep devtools importable as `xtrax.devtools.emit` but EXCLUDED from the built wheel (extend hatch wheel packages / omit from coverage).
2. Implement `src/xtrax/devtools/emit.py` with a frozen dataclass or pydantic envelope:
   - Fields: schema_version:int, run_id:str, dim:str, severity:Literal["info","minor","major","critical"],
     file_line:str, evidence:str, source_track:Literal["deterministic","judgment"], finding_id:str, payload:dict
   - `emit_metric_finding(dim, severity, file_line, evidence, rule_id, symbol_qualname, payload)` — source_track="deterministic"
   - `emit_judgment_finding(dim, severity, file_line, evidence, rubric_id, score, anchor_quote, symbol_qualname)` — source_track="judgment"
   - `finding_id = stable hash(dim + symbol_qualname + rule_id)`; rubric_id substitutes rule_id for judgment findings
   - Content-hash fallback `hash(dim + normalized_evidence)` when symbol_qualname absent
   - Provide `append_finding(record, audits_path=Path(".praxia/audits.jsonl"))` for JSONL append (port/#2180 delegation target)
3. Add `tests/audit/test_emit_contract.py`:
   - Round-trip ONE golden metric record AND ONE golden judgment record
   - Assert schema_version stamped; baseline-diff helper LOUD-FAILS (raises) on schema_version mismatch
   - Assert two judgment findings on same (dim, symbol_qualname, rubric_id) → identical finding_id
4. Add `just audit-emit-contract` running `uv run pytest tests/audit/test_emit_contract.py -v`
5. Run `uv run ruff check src/xtrax/devtools/ tests/audit/test_emit_contract.py` and `uv run pytest tests/audit/test_emit_contract.py -v`

Do NOT add a top-level `audit/` package or `audit/emit.py` — canonical path is `xtrax.devtools.emit`.

## Commit
Do NOT commit locally. Orchestrator commits after reviewer PASS with message:
`feat(audit): N1.1 emit envelope contract in xtrax.devtools (#1577)`
"""
reviewer_prompt = """
VERIFY #1577 [audit-fw N1.1] emit envelope:

1. `src/xtrax/devtools/emit.py` exists with single shared envelope + `emit_metric_finding` and `emit_judgment_finding`
2. `finding_id` uses structural hash(dim + symbol_qualname + rule_id); rubric_id substitutes rule_id for judgment; content-hash fallback for symbol-less findings
3. `append_finding` appends valid JSONL to `.praxia/audits.jsonl` when invoked in tests (use tmp_path)
4. `tests/audit/test_emit_contract.py` passes: metric + judgment golden round-trips; schema_version mismatch raises (not skips); id-stability for duplicate judgment keys
5. `just audit-emit-contract` exits 0
6. No top-level `audit/` package added; `uv run ruff check src/xtrax/devtools/` clean; devtools excluded from wheel

PASS if all six checks hold with command evidence. FAIL otherwise listing which check failed.
"""
return_key = "1577"

