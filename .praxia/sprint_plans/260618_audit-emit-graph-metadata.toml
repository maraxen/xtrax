4. `just validate-node-metadata-schema` exits 0; `just validate-capability-registry` still exits 0
5. `uv run pytest tests/composition/ -v` green; no `src/xtrax/` core changes

PASS if all five checks hold with evidence. FAIL otherwise.
"""
