design pieces, 13 AC bullets -- several added/corrected across 2 adversarial review rounds, read
every AC bullet). Read .praxia/loop_sprint_plan_4216.json's Steps 1-8 for the exact, detailed
decomposition this prompt summarizes -- it has precise file:line anchors and has itself been through
a NEEDS_WORK->FAIL->PASS plan-audit cycle catching 2 real blocking gaps, so follow it precisely rather
than improvising.

**CRITICAL SCOPE BOUNDARY: do NOT invoke `--i-understand-this-creates-real-bathos-state`, do NOT call
this script's `main()`, and do NOT touch `~/.bth/catalog/bathos.db` at any point in this dispatch.**

## Step 1 -- Imports + new module-level constants
Add `import subprocess`; change the `collections.abc` import to include `Mapping`; add
`from typing import Any`; add 3 new repo imports (`BathosFrozenContext`, `Attestation`,
`ClosureManifest`/`build_closure_manifest`) matching the existing `# noqa: E402` pattern. Add new
module-level constants: `_TIMING_PROBE_NAME = "smoke_timing_probe"`, `_TIMING_PROBE_SUFFIX`,
`_TIMING_CONCRETE_INPUTS: list[Any] = [1.0, 2.0]`, `_HIGHER_IS_BETTER = {"metric_a": True, "metric_b": True}`.

## Step 2 -- Closure-manifest / score_fn / frozen_context factory helpers
Add `_build_smoke_closure_manifest(config)`, `_make_smoke_score_fn()` (a FACTORY, not a singleton --
fresh closure over `counter = {"n": 0}` on every call, mirroring
`tests/controller/test_loop_run.py::_make_monotonic_score_fn` exactly), and
`_make_smoke_frozen_context(campaign_name, config)`. Docstrings must state the factory-per-call
requirement explicitly.

## Step 3 -- Extend `_candidate_source` with the fixed timing-probe suffix
Append `_TIMING_PROBE_SUFFIX` to every candidate's generated source.

## Step 4 -- Scratch-git-repo helpers
Add `_run_git(repo, *args)`, `_make_scratch_git_repo(workspace_root) -> Path` (mirrors
`tests/controller/test_loop_run.py::git_repo` fixture, returns ONLY the Path), and a companion
`_head_sha(repo) -> str`.

## Step 5 -- `_smoke_campaign_approval_fn` stub
Add `_smoke_campaign_approval_fn(campaign_id, *, toml_path=None) -> Attestation` matching the real
`campaign_approval_fn` signature exactly, unconditionally returning a valid `Attestation`, never
reading `toml_path`. Docstring must explain WHY: `--i-understand-this-creates-real-bathos-state`
already constitutes this script's human approval.

## Step 6 -- Wire everything into both campaign functions (the critical step)
In `_run_pass_campaign` and `_run_fail_campaign`, construct a scratch git repo, bootstrap sha,
per-campaign `ratchet_ref_name` (reusing the existing `_RUN_SUFFIX`), and add ALL new kwargs to the
`run_campaign_loop(...)` calls: `frozen_context`, `current_config`, `repo`, `ratchet_ref_name`,
`callable_name`, `concrete_inputs`, `higher_is_better`, `candidate_target_path=Path("candidate.py")`,
`bootstrap_commit_sha`, `campaign_approval_fn`, and **`output_paths=["dummy-output.txt"]` (or
equivalent non-empty list) -- REQUIRED, `run_one_candidate_pass` unconditionally raises `ValueError`
on a falsy `output_paths` (controller/main_loop.py:618-620), this is not optional.**

**CRITICAL correctness notes (from plan-audit, do not deviate):**
(a) Do NOT pass `commit_tree_sha` literally -- leave it unset so the real `compute_candidate_tree_sha`
git plumbing genuinely executes.
(b) Do NOT set `allow_fresh_start_despite_existing_lineage=True` -- the genuinely fresh scratch repo +
unique ref means `read_best_so_far` correctly returns `None`, no conflict to override.
(c) `_make_smoke_frozen_context(...)` must be called exactly ONCE inside each campaign function --
never at module level, never shared between the two campaigns.
(d) `output_paths` must be non-empty on BOTH calls -- verify with grep before finishing.

## Step 7 -- AC-6 ratchet assertion
In `_assert_pass_campaign_result`'s per-iteration loop, add a check that
`iteration.ratchet_decision.improved` is `True`, raising `AssertionError` if not.
`_assert_fail_campaign_result` gets ZERO changes -- verify this stays true.

## Step 8 -- Module docstring updates
Add new numbered subsection(s) documenting all 5 new pieces (closure manifest/score_fn, candidate
callable, git ratchet, non-empty current_config, campaign_approval_fn override + why) immediately
after the existing point 6 (which spans lines 103-111 -- NOT 112-132 as an earlier draft mistakenly
cited), BEFORE the existing "## Coherence check" subsection at line 112. Also add: an AC-12 note that
the fail campaign's rejected candidate still writes a real git commit/advances the ratchet ref
(harmless in a scratch repo, but documented); an AC-13 note explaining the git-ratchet-coherence check
is deliberately not added (achievable if restructured, out of scope for this item, noted as a future
enhancement -- not "impossible"). The original 6 design points must remain textually unchanged.

VERIFY before finishing: `uv run python -c "import ast; ast.parse(open('scripts/smoke_lc12_real_e2e.py').read())"` exits 0.
`uv run python -c "import scripts.smoke_lc12_real_e2e"` exits 0. All grep-based checks from the plan
JSON's Steps 1-8 success_criteria pass (especially: `output_paths=` appears exactly twice, both
non-empty; `_make_smoke_frozen_context(` appears exactly twice, one per campaign function;
`commit_tree_sha=` and `allow_fresh_start_despite_existing_lineage` appear zero times in either
`run_campaign_loop(` call). Do NOT run pytest yet (no tests exist until Track B) -- just confirm the
script imports and parses cleanly.

Commit with a descriptive conventional-commit message (e.g. `feat(scripts): wire real closure-manifest/
git-ratchet/campaign-approval machinery into smoke_lc12_real_e2e.py (#4216)`) once verified.
"""
reviewer_prompt = """
VERIFY:
1. All new imports/constants present (Step 1); script imports cleanly.
2. `_build_smoke_closure_manifest`, `_make_smoke_score_fn` (a genuine per-call factory, not a
