.praxia/docs/specs/260813_backlog-4216-xtrax-scripts-smoke-lc12-re.md (session 3649d03c) -- 7 design
pieces, 13 AC bullets. Round 1 found 1 blocking gap (campaign_approval_fn/T2-32 human-approval gate
entirely unaddressed -- the real run would fail at campaign_create before any of the designed machinery
executes, since campaign names embed a fresh UUID every run and no static TOML entry could ever match)
plus 5 minor findings, all patched. A focused re-verification confirmed the fix sound and found one
more wording issue (also patched).

Full 10-step implementation plan is at .praxia/loop_sprint_plan_4216.json in this worktree -- went
through its own NEEDS_WORK->FAIL->PASS cycle: round 2 plan-audit found a SECOND genuine blocking gap
the entire pipeline (brainstorm, defender, challenger x2) had missed -- output_paths, never passed to
