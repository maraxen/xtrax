dimensions). fixer_prompts below are self-contained but the plan JSON + spec doc are the canonical
source if any ambiguity arises.

CRITICAL SCOPE BOUNDARY: neither track in this sprint may invoke
--i-understand-this-creates-real-bathos-state or otherwise call this script's main()/touch the real
~/.bth/catalog/bathos.db. All verification is via scoped, bathos-free unit tests (AC-10). The actual
real-infrastructure run is a separate, explicitly-human-approved step after this sprint closes.
"""
