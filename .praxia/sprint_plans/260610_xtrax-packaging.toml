phase_name = "Track C — [N3] Hybrid + lazy public API surface (populate empty __init__ + PEP562 __getattr__) (#1453)"
fixer_prompt = """
You are building the public API surface for xtrax (DAG node N3 — ROOT GATE 2). task_id: 260610_xtrax-packaging.

CONTEXT: 8 of 11 subpackages already export __all__ (engine, sparse, checkpoint, io, distributed, transforms,
safety, stages). THREE are EMPTY: src/xtrax/training/__init__.py, src/xtrax/data/__init__.py,
src/xtrax/tiling/__init__.py. There is also NO curated top-level surface — users must import subpackages explicitly.
A naive eager flat re-export would force `import xtrax` to import all JAX-heavy submodules (multi-second cold import,
pre-mortem-a). The fix is a HYBRID surface with a LAZY top-level (PEP 562 module-level __getattr__).

TASK:
1. Populate the three empty __init__.py with curated __all__ re-exporting their real public types — read the actual
   modules to get the names:
     - training/: Trainer (training/trainer.py) + the public train-step/types API actually defined there.
     - data/: the dataset/pipeline/module API (BatchPlan lives in tiling — check; export data's real public types).
     - tiling/: AxisSpec, BatchPlan, BatchPlanner + the tiling primitives (strategy/plan/iterator) that are public.
   Match the style of an existing populated subpackage __init__ (e.g. src/xtrax/sparse/__init__.py).
2. In src/xtrax/__init__.py add a curated flat top-level via PEP 562 lazy __getattr__ (NOT eager imports):
     __all__ = ["Trainer", "Engine", "AxisSpec", "BatchPlan", "BoundedCallbackHandler",
                "save_checkpoint", "load_checkpoint", ...]   # the curated 80% surface incl. output-sink names
     _LAZY = {"Trainer": "xtrax.training", "Engine": "xtrax.engine", ...}
     def __getattr__(name):
         if name in _LAZY:
             import importlib
             return getattr(importlib.import_module(_LAZY[name]), name)
         raise AttributeError(f"module 'xtrax' has no attribute {name!r}")
   Keep `__version__ = "0.2.0"` as the FIRST line (node N1) — the lazy block goes BELOW it.

ACCEPTANCE (run all):
- `uv run python -c "from xtrax import Trainer, Engine; print(Trainer, Engine)"`  → works.
- All 11 subpackages export a non-empty __all__:
    `uv run python -c "import importlib; [print(p, bool(getattr(importlib.import_module('xtrax.'+p),'__all__',[]))) for p in ['engine','training','data','tiling','sparse','checkpoint','io','distributed','transforms','safety','stages']]"`  → all True
- Cold-import time bound (clean process, JAX not pre-imported):
    `uv run python -c "import time; t=time.perf_counter(); import xtrax; e=time.perf_counter()-t; assert e<0.5, f'cold import {e:.2f}s exceeds 500ms'; print(f'{e*1000:.0f}ms')"`
- `uv run pytest -q` still green (no import regressions); `uv run ruff check .` clean.
"""
reviewer_prompt = """
Verify Track C (N3 — hybrid + lazy API). task_id: 260610_xtrax-packaging. ROOT GATE — be strict.

Run:
- `uv run python -c "from xtrax import Trainer, Engine"`  → no error  (PASS/FAIL)
- the 11-subpackage __all__ check (all True)  (PASS/FAIL)
- cold-import assertion `import xtrax` < 500ms with JAX not pre-imported  (PASS/FAIL)
- CONFIRM the top-level uses PEP 562 `__getattr__` lazy re-exports, NOT eager `from .training import Trainer`
  (inspect src/xtrax/__init__.py)  (PASS/FAIL — fail if eager, it regresses import time)
- `uv run pytest -q`  → green  (PASS/FAIL)
