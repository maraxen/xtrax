  - N3 (Track c): hybrid + lazy public API surface
Stack rules: `uv run pytest`; `uv run ruff check .` clean before commit; never bare python.
All version strings reconcile to 0.2.0 (pyproject currently 0.2.0, __init__ currently 0.1.0).
"""
