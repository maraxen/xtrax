[sprint]
sprint_id = "260619_audit-n2-type-hardening-gate"
sprint_num = 12
name = "xtrax Loop Sprint 12: N2.3 D3 Type-hardening gate"
description = "Annotation coverage meter + shape-specificity% + scoped beartype import hook."
context = """
task_id: 260617_xtrax-composition-mission
Spec D3: whole-baseline annotation-coverage% + shape-specificity% PRIMARY;
install_import_hook(beartype) pinned to xtrax submodules (not lazy root).
Defer AddedTypesTest LibCST diff-gate.
"""
max_fix_retries = 1
worktree_shadow_mode = false

[[tracks]]
id = "type_hardening"
is_research = false
worktree = false
skip_worktree = true

[[tracks.items]]
backlog_id = "1583"
phase_name = "[audit-fw N2.3] D3 Type-hardening gate (metrics + import hook)"
workflow_template = "refactor_with_audit"
fixer_prompt = """
task_id: 260617_xtrax-composition-mission
Backlog: #1583 [audit-fw N2.3] D3 Type-hardening gate

## 1. Dev deps
Add `beartype` to [project.optional-dependencies] dev in pyproject.toml if missing.

## 2. Scoped beartype hook (tests/conftest.py — NEW at repo tests root)
- Use jaxtyping.import_hook.install_import_hook with packages list covering xtrax submodules ONLY:
  e.g. ["xtrax.transforms", "xtrax.tiling", ...] — NOT "xtrax" lazy root
- Guard with env var XTRAX_DISABLE_BEARTYPE=1 for opt-out
- tests/audit/test_beartype_hook.py: smoke test that a deliberately wrong jaxtyped function raises when imported under hook (use a tiny inline module in tmp_path or tests/fixtures/beartype_probe.py)

## 3. Type metrics module
src/xtrax/devtools/gates/type_hardening.py:
- scan_package_annotations(root: Path) -> AnnotationStats(public_params, annotated_params, array_annotations, shape_typed_arrays)
- annotation_coverage_pct = annotated_params / public_params (0 if no public params)
- shape_specificity_pct = shape_typed_arrays / array_annotations (1.0 if no array annotations)
- run_type_hardening_gate(target, audits_path, baseline_path) -> GateResult with both metrics, emit findings, evaluate/update baseline keys:
  - type_hardening.annotation_coverage_pct (maximize)
  - type_hardening.shape_specificity_pct (maximize) — ADD to .praxia/audit_baseline.json seed

## 4. CLI + Justfile
scripts/audit_type_hardening_gate.py (mirror other gate CLIs)
just audit-type-hardening-gate

## 5. Tests
tests/audit/test_type_hardening_gate.py — unit tests for AST scanner on small fixture module; gate pass/regression with tmp baseline; committed baseline has both metrics

## Verification
- uv run pytest tests/audit/test_type_hardening_gate.py tests/audit/test_beartype_hook.py -v
- just audit-type-hardening-gate exits 0
- ruff clean

Do NOT commit.
"""
reviewer_prompt = """
VERIFY #1583: beartype hook scoped + smoke test; type_hardening gate meters both baseline metrics; recipes/tests pass.
PASS/FAIL with evidence.
"""
return_key = "1583"

[orchestration]
sequential = ["type_hardening"]
concurrent = []
