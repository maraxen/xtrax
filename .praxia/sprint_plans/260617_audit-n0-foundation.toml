[sprint]
sprint_id = "260617_audit-n0-foundation"
sprint_num = 1
name = "xtrax Loop Sprint 1: Audit framework N0 foundation gates"
description = "Wave 1 of audit-framework-foundation epic: import-linter cycle block, no-__future__ guard, ruff jaxtyping per-file ignores."
context = """
Autonomous loop task_id: 260617_xtrax-composition-mission
Spec: .praxia/docs/specs/260611_re-run-v2-refine-and-enrich-the-xtrax-sy.md (foundation gates)
Epic: audit-framework-foundation (#1573+)
Stack: uv, pytest, ruff. No jaxlint in this wave.
"""
max_fix_retries = 1
worktree_shadow_mode = false

[[tracks]]
id = "a"
is_research = false
worktree = false
skip_worktree = true

[[tracks.items]]
backlog_id = "1573"
phase_name = "N0.1 import-linter cycle-block foundation gate"
fixer_prompt = """
task_id: 260617_xtrax-composition-mission
Backlog: #1573 [audit-fw N0.1] import-linter cycle-block foundation gate
Spec: .praxia/docs/specs/260611_re-run-v2-refine-and-enrich-the-xtrax-sy.md (foundation gates; lazy __getattr__ root note)

## Steps
1. Add `import-linter` to dev dependencies in pyproject.toml
2. Create `.importlinter` or `[tool.importlinter]` in pyproject.toml with contracts:
   - Analyze `xtrax` subpackages directly (ignore lazy root re-exports)
   - Forbid import cycles among: transforms, tiling, stages, run, training, engine, data, distributed, safety, checkpoint, io, sparse, eda
   - `eda` may depend on `tiling` only among internals; core modules must not import `eda`
3. Add `just audit-imports` running `uv run lint-imports` (or `import-linter`)
4. Add `tests/audit/test_import_cycles.py` smoke test that subprocess runs import-linter and expects exit 0
5. Run `uv run pytest tests/audit/test_import_cycles.py -v` and `uv run ruff check .`

Edit only — verify existing files before Write on pyproject.toml.
Do NOT commit — orchestrator commits after VERIFY.
"""
reviewer_prompt = """
VERIFY #1573 import-linter foundation gate:
1. import-linter config exists and references xtrax subpackages
2. `uv run pytest tests/audit/test_import_cycles.py -v` passes
3. `just audit-imports` exists and exits 0
4. No import cycles reported
PASS if all true; FAIL otherwise with evidence.
"""
return_key = "1573"

[[tracks.items]]
backlog_id = "1574"
phase_name = "N0.2 no-from-__future__-import-annotations guard"
fixer_prompt = """
task_id: 260617_xtrax-composition-mission
Backlog: #1574 [audit-fw N0.2] no-`from __future__ import annotations` guard
Depends on: #1573 complete (same sprint, run after track a item 1 if sequential)

## Steps
1. Add `tests/audit/test_no_future_annotations.py` that scans all `src/xtrax/**/*.py` and fails if any file contains `from __future__ import annotations`
2. Add `just audit-no-future-annotations` to Justfile
3. Confirm no existing xtrax source files violate (fix if any found)
4. Run full `uv run pytest tests/audit/ -v`

Do NOT commit.
"""
reviewer_prompt = """
VERIFY #1574:
1. tests/audit/test_no_future_annotations.py exists and passes
2. just audit-no-future-annotations runs clean
3. No src/xtrax file uses from __future__ import annotations
PASS/FAIL with evidence.
"""
return_key = "1574"

[[tracks.items]]
backlog_id = "1575"
phase_name = "N0.3 ruff F722/F821 per-file ignores for jaxtyping"
fixer_prompt = """
task_id: 260617_xtrax-composition-mission
Backlog: #1575 [audit-fw N0.3] ruff F722/F821 per-file ignores for jaxtyping modules
Spec: foundation for jaxtyping shape strings

## Steps
1. Add jaxtyping + beartype to dev optional deps if missing
2. In pyproject.toml [tool.ruff.lint.per-file-ignores], add entries for any modules that will use jaxtyping shape annotations (start with tests/audit/ placeholder or document pattern in audit/README.md)
3. Add `tests/audit/test_ruff_jaxtyping_config.py` verifying per-file-ignores key exists in pyproject.toml
4. Add `just audit-foundation` aggregate target running audit-imports + audit-no-future-annotations
5. Run `uv run pytest tests/audit/ -v` and `uv run ruff check .`

Do NOT commit.
"""
reviewer_prompt = """
VERIFY #1575:
1. [tool.ruff.lint.per-file-ignores] documents F722/F821 pattern for jaxtyping
2. tests/audit/ suite passes
3. just audit-foundation exists
PASS/FAIL with evidence.
"""
return_key = "1575"

[orchestration]
sequential = ["a"]
concurrent = []
