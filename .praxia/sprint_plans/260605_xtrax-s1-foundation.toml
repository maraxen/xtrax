from dataclasses import dataclass

def get_k_bucket(n: int) -> int:
    # Mandated: integer bit_length — NOT 2**ceil(log2(n))
    if n <= 0:
        raise ValueError(f"get_k_bucket: n must be > 0, got {n}")
    return 1 << (n - 1).bit_length()

@dataclass(frozen=True)
class DedupSpec:
    k_bucket: int
    max_unique: int
    def __post_init__(self) -> None:
        if self.k_bucket <= 0 or (self.k_bucket & (self.k_bucket - 1)) != 0:
            raise ValueError(f"DedupSpec: k_bucket={self.k_bucket} must be a positive power of 2.")
        if self.k_bucket < self.max_unique:
            raise ValueError(f"DedupSpec: k_bucket={self.k_bucket} must be >= max_unique={self.max_unique}.")
```

