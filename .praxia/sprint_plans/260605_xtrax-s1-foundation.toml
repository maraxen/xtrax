Implement safe_scan in src/xtrax/transforms/scan.py:

```python
from collections.abc import Callable
from typing import TypeVar
import jax

Carry = TypeVar("Carry")
X = TypeVar("X")
Y = TypeVar("Y")

def safe_scan(
    fn: Callable[[Carry, X], tuple[Carry, Y]],
    init: Carry,
    xs: X,
    length: int | None = None,
    reverse: bool = False,
    unroll: int | bool = 1,
) -> tuple[Carry, Y]:
    effective_length = length
    if effective_length is None:
        leaves = jax.tree.leaves(xs)
        effective_length = leaves[0].shape[0] if leaves else 0
    if effective_length == 0:
        raise ValueError("safe_scan: xs has leading axis of length 0.")
    return jax.lax.scan(fn, init, xs, length=length, reverse=reverse, unroll=unroll)
```

CRITICAL: Do NOT add `if init is None: raise`. None is a legal lax.scan carry.

Update src/xtrax/transforms/__init__.py to also export safe_scan.

Write tests/transforms/test_scan.py with tests for:
- normal scan (compare with jax.lax.scan)
- empty xs (length=0 inferred) → ValueError
- length=0 explicit → ValueError
- reverse=True
- unroll>1 (same result as unroll=1)
- init=None is legal (must not raise)

Gate: `uv run pytest tests/transforms/test_scan.py -v` all pass; `uv run ruff check src/xtrax/transforms/scan.py` clean.
"""
