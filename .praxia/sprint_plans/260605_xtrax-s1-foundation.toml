Implement make_axis_dispatch in src/xtrax/tiling/dispatch.py:

```python
from collections.abc import Callable
from typing import Any
import jax
from xtrax.tiling.strategy import AxisStrategy, DedupGather, SafeMap, Scan, Vmap
from xtrax.transforms.map import safe_map
from xtrax.transforms.scan import safe_scan

def make_axis_dispatch(strategy: AxisStrategy, fn: Callable, xs: Any, init: Any = None) -> Any:
    if isinstance(strategy, Vmap):
        return jax.vmap(fn)(xs)
    elif isinstance(strategy, SafeMap):
        return safe_map(fn, xs, batch_size=strategy.batch_size)
    elif isinstance(strategy, Scan):
        if init is None:
            raise ValueError("make_axis_dispatch: Scan strategy requires a non-None init carry.")
        # fn is IGNORED for Scan — use strategy.transition
        return safe_scan(strategy.transition, init, xs)
    elif isinstance(strategy, DedupGather):
        deduped_xs, gather_indices = strategy.dedup_fn(xs)  # explicit unpacking
        ys = safe_map(fn, deduped_xs)
        return strategy.gather_fn(ys, gather_indices)
    else:
        raise TypeError(f"Unknown strategy type: {type(strategy)}")
```

Write tests for all 4 strategies: Vmap dispatches; SafeMap dispatches + ValueError for non-divisible; Scan with init=None raises; Scan with init uses strategy.transition (fn ignored); DedupGather with explicit dedup/gather fns.

Gate: `uv run pytest tests/tiling/test_dispatch.py -v` all pass; `uv run ruff check src/xtrax/tiling/dispatch.py` clean.
"""
reviewer_prompt = """
