Implement safe_map in src/xtrax/transforms/map.py:

```python
from collections.abc import Callable
from typing import TypeVar
import jax

PyTree = TypeVar("PyTree")

def safe_map(fn: Callable, xs: PyTree, batch_size: int | None = None) -> PyTree:
    n = jax.tree.leaves(xs)[0].shape[0]
    if batch_size is None or n <= batch_size:
        return jax.vmap(fn)(xs)
    if n % batch_size != 0:
        raise ValueError(
            f"safe_map: n={n} is not divisible by batch_size={batch_size}. "
            "Ensure cardinality is a multiple of batch_size."
        )
    return jax.lax.map(fn, xs, batch_size=batch_size)
```

