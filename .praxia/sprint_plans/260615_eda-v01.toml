task_id: 260615_eda-viz-api
Create new file: src/xtrax/eda/viz.py
Requires eda extras (seaborn, matplotlib). Full render() implementation.

Read first:
- .praxia/docs/specs/260615_xtrax-eda-api-revised.md — Module Contracts / viz.py section
- src/xtrax/eda/types.py — PlanStatsDict, PlanLogger, PanelName, _VALID_PANELS

Structure:

  import matplotlib
  matplotlib.use("Agg")  # MUST be before any other matplotlib import

  try:
      import seaborn as sns
      import matplotlib.pyplot as plt
  except ImportError as exc:
      raise ImportError(
          "xtrax.eda.viz requires visualization extras. "
          "Install with: pip install xtrax[eda]"
      ) from exc

  from __future__ import annotations
  import io, json
  from pathlib import Path
  from typing import Callable, Literal
  from xtrax.tiling.plan import BatchPlan
  from xtrax.eda.types import PlanStatsDict, PlanLogger, _VALID_PANELS
  from xtrax.eda.stats import extract_plan_stats

  _REQUIRED_STATS_KEYS = frozenset({"axes","strategy_counts","total_axes","memory_warnings","dedup_stats","bucket_stats"})

  def render(
      plan: BatchPlan,
      view: str = "dashboard",
      fmt: Literal["png","svg","html"] = "png",
      path: str | Path | None = None,
      stats_transform: Callable[[PlanStatsDict], PlanStatsDict] | None = None,
      metadata: bool = False,
      logger: PlanLogger | None = None,
      step: int | None = None,
      panels: set[str] | None = None,
  ) -> bytes | str | None:

      # Validation
      if metadata and path is None:
          raise ValueError("metadata=True requires path to be set")
      if panels is not None:
          unknown = panels - _VALID_PANELS
          if unknown:
              raise ValueError(f"Unknown panel(s): {unknown!r}. Valid panels: {sorted(_VALID_PANELS)}")

      # Extract stats
      stats = extract_plan_stats(plan)

      # Apply transform
      if stats_transform is not None:
          stats = stats_transform(stats)
          missing = _REQUIRED_STATS_KEYS - stats.keys()
          if missing:
              raise TypeError(f"stats_transform must return PlanStatsDict with all required keys; missing: {missing!r}")

      # Filter panels
      active_panels = panels if panels is not None else set(_VALID_PANELS)

      # Build figure: one subplot per active panel that has data
      # Strategy panel: sns.barplot of strategy_counts
      # Cardinality panel: sns.scatterplot of cardinality vs batch_size
      # (other panels: skip if no data, show placeholder)
      # EMPTY PLAN GUARD: if stats["total_axes"] == 0, render a placeholder figure
      # with text "No axes in plan" — do NOT call seaborn with empty DataFrames.

      # AMD-5: each panel's axes group gets data-panel="<name>" in SVG output.
      # Implement by rendering each panel to SVG individually, wrapping in
      # <g data-panel="strategy">...</g> etc., then combining.
      # Simplest approach: render full figure to SVG, post-process with string replace
      # to inject data-panel attrs on <g> elements by position.
      # OR: use matplotlib's ax.set_gid(f"panel-{name}") before savefig — this sets
      # the SVG id attribute, then rename id -> data-panel in post-process.

      # Render
      buf = io.BytesIO()
      if fmt == "png":
          plt.savefig(buf, format="png", bbox_inches="tight")
          result: bytes | str = buf.getvalue()
      elif fmt == "svg":
          plt.savefig(buf, format="svg", bbox_inches="tight")
          svg_bytes = buf.getvalue()
          # Post-process: inject data-panel attributes
          svg_str = svg_bytes.decode("utf-8")
          # (inject data-panel via gid or string processing)
          result = svg_str.encode("utf-8")
      elif fmt == "html":
          plt.savefig(buf, format="svg", bbox_inches="tight")
          svg_content = buf.getvalue().decode("utf-8")
          # inject data-panel attributes
          result = f"<html><body>{svg_content}</body></html>"
      plt.close("all")

      # Write to path
      if path is not None:
          p = Path(path)
          if fmt == "html":
              p.write_text(result if isinstance(result, str) else result.decode())
          else:
              p.write_bytes(result if isinstance(result, bytes) else result.encode())
          if metadata:
              p.with_suffix(".json").write_text(json.dumps(stats, default=str))
          if logger is not None:
              logger.log_figure(figure=result, fmt=fmt, step=step)
          return None
      else:
          if logger is not None:
              logger.log_figure(figure=result, fmt=fmt, step=step)
          return result

IMPORTANT implementation notes:
- matplotlib.use("Agg") MUST be the first matplotlib call in the file
- plt.close("all") after every render to prevent figure accumulation
- Empty plan guard: check stats["total_axes"] == 0 before any sns call
- AMD-5: data-panel attributes in SVG — use ax.set_gid(f"panel-{name}") and post-process
"""
