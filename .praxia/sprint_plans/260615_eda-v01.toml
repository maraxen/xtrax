  from xtrax.tiling.plan import BatchPlan
  from xtrax.eda.types import PlanStatsDict
  from xtrax.eda.stats import extract_plan_stats

  def explain_plan(plan: BatchPlan) -> PlanStatsDict:
      stats = extract_plan_stats(plan)
      # The 'reasoning' field in each AxisStatsEntry is already populated
      # by extract_plan_stats via decision.reasoning.
      # explain_plan's contract is that reasoning is ALWAYS non-empty string.
      # If any entry has empty reasoning, substitute:
      #   f"No reasoning recorded for axis '{entry['name']}'"
      for entry in stats["axes"]:
          if not entry["reasoning"]:
              entry["reasoning"] = f"No reasoning recorded for axis '{entry['name']}'"
      return stats

explain_plan is intentionally thin — its value is the contract guarantee (non-empty reasoning)
and the stable public name. Do not over-engineer.
