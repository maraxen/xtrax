Implement:

1. extract_plan_stats(plan: BatchPlan) -> PlanStatsDict
   Walk plan.decisions. For each AxisDecision:
   - Build AxisStatsEntry: name=decision.spec.name, strategy=type(decision.strategy).__name__,
     cardinality=decision.spec.cardinality, batch_size=decision.batch_size,
     reasoning=decision.reasoning, memory_estimate_bytes=None
   - Accumulate strategy_counts[strategy_name] += 1
   - If decision.strategy is DedupGather: call analyze_dedup(decision) and append to dedup_stats
   - If decision.strategy is Bucket: call analyze_bucket(decision) and append to bucket_stats
   Return PlanStatsDict with all fields populated. Empty plan -> all lists empty, total_axes=0.

2. analyze_dedup(decision: AxisDecision) -> DedupStatsEntry
   Raises TypeError if not isinstance(decision.strategy, DedupGather):
     TypeError(f"analyze_dedup requires DedupGather strategy; got {type(decision.strategy).__name__}")
   Fields:
   - unique_count = decision.strategy.k
   - padded_count = decision.strategy.k_bucket
   - total_count = decision.spec.cardinality
   - padding_waste = padded_count - unique_count
   - dedup_ratio = 1.0 - (unique_count / total_count) if total_count > 0 else 0.0

