from typing import Any
import jax
import optax

PyTree = Any

def no_bias_wd_mask(params: PyTree) -> PyTree:
    # Mandated exactly: ndim != 1 → True (apply weight decay), 1-D → False (skip)
    return jax.tree.map(lambda x: x.ndim != 1, params)

def make_optimizer(base: optax.GradientTransformation, clip_norm: float = 1.0) -> optax.GradientTransformation:
    # clip BEFORE base optimizer
    return optax.chain(optax.clip_by_global_norm(clip_norm), base)

def adamw_with_schedule(
    peak_lr: float,
    warmup_steps: int,
    total_steps: int,
    weight_decay: float = 1e-4,
    b1: float = 0.9,
    b2: float = 0.999,
    eps: float = 1e-8,
    clip_norm: float = 1.0,
    wd_mask: Any = None,
) -> optax.GradientTransformation:
    if wd_mask is None:
        wd_mask = no_bias_wd_mask
    schedule = optax.warmup_cosine_decay_schedule(
        init_value=0.0, peak_value=peak_lr,
        warmup_steps=warmup_steps,
        decay_steps=total_steps,  # total steps, NOT total-warmup
        end_value=0.0,
    )
    base = optax.adamw(
        learning_rate=schedule, weight_decay=weight_decay,
        b1=b1, b2=b2, eps=eps,
        mask=wd_mask,  # mask IS always passed — mandatory
    )
    return make_optimizer(base, clip_norm=clip_norm)

def partition_labels(model: Any, label_fn: Any) -> Any:
    return jax.tree.map(label_fn, model)
```

