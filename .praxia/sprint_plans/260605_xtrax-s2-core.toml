import signal
from collections.abc import Callable

class PreemptionHandler:
    def __init__(self, save_fn: Callable, rank: int = 0) -> None:
        self._save_fn = save_fn
        self._rank = rank
        self._registered = False

    def register(self) -> None:
        if self._registered:
