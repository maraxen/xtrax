import jax.numpy as jnp
import jax

def safe_norm(x: jax.Array, axis: int | None = None, keepdims: bool = False) -> jax.Array:
    # Use linalg.norm but prevent NaN gradient at zero by adding eps before sqrt
    sq = jnp.sum(x * x, axis=axis, keepdims=keepdims)
    return jnp.sqrt(sq + jnp.finfo(x.dtype).eps)

def safe_reciprocal(x: jax.Array) -> jax.Array:
    eps = jnp.finfo(x.dtype).eps
    return jnp.where(jnp.abs(x) < eps, 1.0 / eps, 1.0 / x)
```

