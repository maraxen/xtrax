from collections.abc import Callable
from dataclasses import dataclass
from typing import Any
import jax
import jax.experimental.checkify as checkify

@dataclass
class SafetyManager:
    enabled: bool = True

def with_safety(fn: Callable, mgr: SafetyManager) -> Callable:
    if not mgr.enabled:
        return fn  # strict identity: return fn unchanged
    checked_fn = checkify.checkify(fn, errors=checkify.float_checks)
    @jax.jit
    def wrapped(*args, **kwargs):
        err, result = checked_fn(*args, **kwargs)
        err.throw()
        return result
    return wrapped
```

