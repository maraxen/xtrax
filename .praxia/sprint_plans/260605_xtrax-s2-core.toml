Implement accumulate_grads in src/xtrax/training/grad.py using jax.lax.scan — NO Python for-loop:

```python
from collections.abc import Callable
from typing import Any
import jax
import jax.numpy as jnp
import equinox as eqx

def accumulate_grads(
    loss_fn: Callable,
    params: Any,
    microbatches: list,
    filter_spec: Any = None,
) -> tuple[Any, jax.Array]:
    if filter_spec is None:
        filter_spec = eqx.is_array

    # Validate all microbatches are equal size
    sizes = [jax.tree.leaves(mb)[0].shape[0] for mb in microbatches]
    if len(set(sizes)) > 1:
        raise ValueError(
            f"accumulate_grads: all microbatches must be equal size, got sizes={sizes}"
        )

    # Stack microbatches into a leading-axis pytree for lax.scan
    stacked = jax.tree.map(lambda *xs: jnp.stack(xs), *microbatches)

    def scan_fn(carry, microbatch):
        loss, grads = eqx.filter_value_and_grad(loss_fn)(params, microbatch)
        return carry, (grads, loss)

    _, (all_grads, all_losses) = jax.lax.scan(scan_fn, None, stacked)

    # Mean over microbatches
    mean_grads = jax.tree.map(lambda g: jnp.mean(g, axis=0), all_grads)
    mean_loss = jnp.mean(all_losses)
    return mean_grads, mean_loss
```

