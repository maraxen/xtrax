from collections.abc import Callable
from typing import Any
import equinox as eqx

class StageBundle(eqx.Module):
    # Base class for typed optional-slot bags.
    # Subclasses declare optional Callable fields; topology inferred from non-None fields.
    # NO __call__ method — caller decides how to sequence stages.
    # WARNING: Do NOT branch on field presence inside jax.jit — caller precondition.

    def active_stages(self) -> dict[str, Callable]:
        return {
            name: val
            for name, val in self.__dict__.items()
            if isinstance(val, Callable) and val is not None
        }

    def has_stage(self, name: str) -> bool:
        val = getattr(self, name, None)
        return val is not None and callable(val)
```

