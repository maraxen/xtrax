from typing import Any
import jax
import jax.numpy as jnp
import equinox as eqx
import optax
from xtrax.training.types import LossFunction, ResumableState

class Trainer(eqx.Module):
    loss_fn: LossFunction
    optimizer: optax.GradientTransformation

    @eqx.filter_jit
    def step(self, state: ResumableState, batch: Any) -> tuple[ResumableState, jax.Array]:
        def loss_fn_inner(model):
            predictions = model(batch["inputs"])
            return self.loss_fn(predictions, batch["targets"])

        loss, grads = eqx.filter_value_and_grad(loss_fn_inner)(state.model)
        # Pass params as 3rd arg to optimizer.update — required for adamw and weight decay
        updates, new_opt_state = self.optimizer.update(grads, state.opt_state, state.model)
        new_model = eqx.apply_updates(state.model, updates)
        new_state = eqx.tree_at(
            lambda s: (s.model, s.opt_state, s.step),
            state,
            (new_model, new_opt_state, state.step + 1),
        )
        return new_state, loss
```

