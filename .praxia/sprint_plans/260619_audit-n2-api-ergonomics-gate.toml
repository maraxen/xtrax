[sprint]
sprint_id = "260619_audit-n2-api-ergonomics-gate"
sprint_num = 15
name = "xtrax Loop Sprint 15: N2.6 D6 API-ergonomics gate"
description = "AST param-sprawl gate: public APIs with >5 required parameters."
context = """
task_id: 260617_xtrax-composition-mission
Rubric D6: >5 required params = score-1 signal. Deterministic gate counts violations.
"""
max_fix_retries = 1
worktree_shadow_mode = false

[[tracks]]
id = "api_ergonomics"
is_research = false
worktree = false
skip_worktree = true

[[tracks.items]]
backlog_id = "1586"
phase_name = "[audit-fw N2.6] D6 API-ergonomics gate"
workflow_template = "refactor_with_audit"
fixer_prompt = """
task_id: 260617_xtrax-composition-mission
Backlog: #1586 [audit-fw N2.6] D6 API-ergonomics gate

## Goal
Deterministic API ergonomics gate: count public callables with >5 required parameters (excluding self/cls).

## Code
- src/xtrax/devtools/gates/api_ergonomics.py
  - scan_param_sprawl(root: Path, max_required: int = 5) -> list[SprawlViolation] (qualname, file_line, required_count)
  - METRIC_KEY = "api_ergonomics.param_sprawl_violation_count" (minimize)
  - run_api_ergonomics_gate(target, audits_path, baseline_path) -> GateResult
  - Emit one finding per violation (or aggregate + detail list in payload); evaluate baseline
- scripts/audit_api_ergonomics_gate.py CLI
- .praxia/audit_baseline.json seed metric minimize 0
- tests/audit/test_api_ergonomics_gate.py with fixture module
- Justfile: audit-api-ergonomics-gate

## Verification
- pytest tests/audit/test_api_ergonomics_gate.py -v
- just audit-api-ergonomics-gate exits 0
- ruff clean

Do NOT commit.
"""
reviewer_prompt = """
VERIFY #1586: param sprawl AST gate, baseline ratchet, tests + just pass.
PASS/FAIL with evidence.
"""
return_key = "1586"

[orchestration]
sequential = ["api_ergonomics"]
concurrent = []
