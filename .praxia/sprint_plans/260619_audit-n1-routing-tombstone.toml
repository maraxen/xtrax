task_id: 260617_xtrax-composition-mission
Backlog: #1580 [audit-fw N1.4] tombstone ledger + governance
Depends: #1579 routing (same sprint, run after routing track)

Spec: .praxia/docs/specs/260611_re-run-v2-refine-and-enrich-the-xtrax-sy.md (Q4 tombstone ledger)
Reference: src/xtrax/devtools/emit.py (finding_id, append_finding)

## Goal
Tombstone ledger at .praxia/audit_tombstones.jsonl with governance fields; emit skips tombstoned finding_ids.

## File anchors
- src/xtrax/devtools/tombstone.py (new)
- .praxia/audit_tombstones.jsonl — seed empty file OR one comment line is NOT valid JSONL; use empty file or no seed lines
- tests/audit/test_tombstone_ledger.py (new)
- src/xtrax/devtools/emit.py — add optional tombstone filter to append_finding (minimal change)
- Justfile — `audit-tombstone-contract` recipe

## tombstone.py API
1. `DEFAULT_TOMBSTONE_PATH = Path(".praxia/audit_tombstones.jsonl")`
2. `@dataclass TombstoneEntry: finding_id, reason, actor, recorded_at, disposition` where disposition ∈ accepted|wontfix|out_of_scope
3. `load_tombstones(path=...) -> set[str]` — returns finding_id set
4. `is_tombstoned(finding_id, path=...) -> bool`
5. `append_tombstone(entry, path=...) -> None` — atomic append; validates finding_id non-empty
6. `filter_tombstoned(findings: list[AuditFinding], path=...) -> list[AuditFinding]` — drops tombstoned

## emit.py integration
- `append_finding(record, audits_path=..., tombstone_path=...)` skips append when is_tombstoned(record.finding_id)
- Do NOT break existing emit contract tests — tombstone_path defaults to DEFAULT_TOMBSTONE_PATH; empty file = no tombstones

## Tests
- append_tombstone + is_tombstoned round-trip
- append_finding skips tombstoned finding_id
- append_finding still writes non-tombstoned findings
- governance fields persisted in JSONL

## Verification
- `uv run pytest tests/audit/test_tombstone_ledger.py tests/audit/test_emit_contract.py -v`
- `just audit-tombstone-contract` exits 0
- ruff clean

Do NOT commit.
Suggested commit message: feat(audit): N1.4 tombstone ledger + emit governance (#1580)
"""
reviewer_prompt = """
VERIFY #1580:
1. tombstone.py with load/is_tombstoned/append/filter
2. append_finding skips tombstoned finding_ids; existing emit tests still pass
3. tests/audit/test_tombstone_ledger.py passes
4. just audit-tombstone-contract exits 0
PASS/FAIL with evidence.
"""
