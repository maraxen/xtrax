fixer_prompt = """
task_id: 260617_xtrax-composition-mission
Backlog: #1579 [audit-fw N1.3] audit/routing.toml + severity×track matrix

Spec: .praxia/docs/specs/260611_re-run-v2-refine-and-enrich-the-xtrax-sy.md (CC5 matrix)
Existing: audit/routing.toml has domain=port interim rows (#2280); tests/audit/test_routing_toml.py

## Goal
Complete the CC5 routing substrate: full dimension-domain matrix + Python resolve engine.

## File anchors
- audit/routing.toml — KEEP existing domain=port rows; ADD domain=dimension rows for default track×severity routing
- src/xtrax/devtools/routing.py (new)
- tests/audit/test_routing_toml.py — extend for dimension rows
- tests/audit/test_routing_engine.py (new)
- Justfile — `audit-routing-contract` recipe
- audit/README.md — document matrix + TD-2180-03 ownership note

## routing.toml dimension rows (domain=dimension)
Add rows covering deterministic + judgment tracks × info/minor/major/critical:
- deterministic + critical/major → block_ci
- deterministic + minor → found_issues
- deterministic + info → found_issues
- judgment + critical/major → backlog_node
- judgment + minor/info → found_issues
Use `signal = "severity"` and `condition` matching severity literal (or omit signal for default severity match).
Bump matrix version to 0.2.0.

## routing.py API
1. `DEFAULT_ROUTING_PATH = Path("audit/routing.toml")`
2. `@dataclass RouteRow: domain, track, severity, destination, signal="", condition=""`
3. `load_routing_matrix(path=...) -> list[RouteRow]`
4. `resolve_destination(*, domain: str, track: SourceTrack, severity: Severity, signals: dict[str,str] | None = None) -> str`
   - Match most specific row: domain + track + severity; optional signal/condition when signals dict provided (port rows)
   - Fall back domain=dimension rows when domain-specific row missing
   - Loud-fail ValueError if no row matches
5. Reuse Severity/SourceTrack from xtrax.devtools.emit

## Tests
- Dimension rows exist for all 8 track×severity combos (4 severities × 2 tracks)
- resolve_destination("dimension", "deterministic", "major") == "block_ci"
- resolve_destination("port", "deterministic", "major", signals={"tier_verdict.status": "FAIL"}) works with port rows
- Invalid combo raises ValueError

## Verification
- `uv run ruff check src/xtrax/devtools/routing.py tests/audit/test_routing_*.py`
- `uv run pytest tests/audit/test_routing_toml.py tests/audit/test_routing_engine.py -v`
- `just audit-routing-contract` exits 0

Do NOT commit.
Suggested commit message: feat(audit): N1.3 CC5 routing matrix + resolve engine (#1579)
"""
reviewer_prompt = """
VERIFY #1579:
1. audit/routing.toml has domain=dimension rows for deterministic+judgment × all severities; port rows preserved
2. src/xtrax/devtools/routing.py load + resolve_destination works
3. tests pass; just audit-routing-contract exits 0
4. ruff clean on new files
PASS/FAIL with command evidence.
"""
return_key = "1579"

