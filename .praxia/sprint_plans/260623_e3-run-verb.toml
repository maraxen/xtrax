## Resolved decisions (mechanical — implement exactly as stated)
- Hash domain: the PARSED dict (not raw TOML text). Hashing raw text makes key-order and
  whitespace significant → identical-meaning configs hash differently → AC7 collision logic
  misfires. Canonical: parse → sorted-key JSON → sha256.
- Formula (exact, from AC9):
  `config_hash = sha256(json.dumps(cfg_dict, sort_keys=True, default=str).encode()).hexdigest()[:12]`
  - `sort_keys=True`: stable under kwargs reordering.
  - `default=str`: handles TOML datetimes and other non-JSON-native values without error.
  - `[:12]`: 12 hex characters (48 bits) — sufficient uniqueness for a local run-dir namespace.

