## Goal
Implement `load_config(path: str) -> TrainConfig` using stdlib `tomllib`. This function
parses a TOML file and validates the result into a `TrainConfig`. A missing top-level
`schema_version` raises `ConfigError` immediately — no silent default.

## Resolved decisions (all mechanical — implement exactly as stated)
- `schema_version` is REQUIRED. Missing → `ConfigError("missing required field: schema_version")`.
- `num_epochs` must be a positive int. `None` or `<= 0` → `ConfigError("num_epochs must be a positive int")`.
  Rationale: `Engine.fit_sync` calls `range(num_epochs)` which raises TypeError on None.
- `[loss]` section is REQUIRED. Missing → `ConfigError("missing required section: [loss]")`.
  Rationale: `Trainer(loss_fn, optimizer)` requires loss_fn; there is no default loss.
- Use stdlib `tomllib` (Python ≥ 3.11): `import tomllib`. No new runtime dependency.
- `load_fn` is in `src/xtrax/cli/loader.py` — do NOT modify loader.py.

## Files to edit/create

EDIT src/xtrax/cli/config.py:
  Add `load_config(path: str) -> TrainConfig` function:
  ```python
  import tomllib
  from xtrax.cli.config import TrainConfig, ConfigError

  def load_config(path: str) -> TrainConfig:
      with open(path, "rb") as f:
          raw = tomllib.load(f)

      # Validate schema_version (required, no default)
      if "schema_version" not in raw:
          raise ConfigError("missing required field: schema_version")

      # Validate required sections
      for section in ("model", "optimizer", "loss", "data"):
          if section not in raw:
              raise ConfigError(f"missing required section: [{section}]")

      # Validate num_epochs
      num_epochs = raw.get("num_epochs")
      if not isinstance(num_epochs, int) or num_epochs <= 0:
          raise ConfigError(
              f"num_epochs must be a positive int, got: {num_epochs!r}"
          )

      # Validate seed
      seed = raw.get("seed")
      if not isinstance(seed, int):
          raise ConfigError(f"seed must be an int, got: {seed!r}")

      return TrainConfig(
          schema_version=raw["schema_version"],
          model=raw["model"],
          optimizer=raw["optimizer"],
          loss=raw["loss"],
          data=raw["data"],
          seed=seed,
          num_epochs=num_epochs,
      )
  ```

