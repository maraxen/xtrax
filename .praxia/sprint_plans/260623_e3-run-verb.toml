```python
import jax
import jax.numpy as jnp
import equinox as eqx
from xtrax.training.types import ResumableState

def init_state(model, optimizer, seed: int) -> ResumableState:
    \"\"\"
    Construct an initial ResumableState for a training run.

    Args:
        model: an eqx.Module (the model to train)
        optimizer: an optax.GradientTransformation (already instantiated)
        seed: integer RNG seed

    Returns:
        ResumableState with:
          step = jnp.asarray(0, jnp.int32)   ← dtype pinned to int32
          key  = jax.random.PRNGKey(seed)
          model = model (unchanged)
          opt_state = optimizer.init(eqx.filter(model, eqx.is_array))
          extras = {}
    \"\"\"
    return ResumableState(
        step=jnp.asarray(0, jnp.int32),
        key=jax.random.PRNGKey(seed),
        model=model,
        opt_state=optimizer.init(eqx.filter(model, eqx.is_array)),
        extras={},
    )
```

