   `parent_sha` falling back to `commit_parent_sha` and `expected_old_sha=None`.
3. Mismatched `best_fitness`/`higher_is_better` (one `None`, one not) raises `ValueError` before any
   ratchet or crash-atomicity call.
4. `guarded_evaluate_fn` is called with the exact args spec'd in Step 1 (spy assertion) -- never
   anything read off `CandidateRunResult`.
5. `ClosureHashMismatchError`/`UnlistedReadError` injected from `guarded_evaluate_fn` propagates
   UNCAUGHT out of `run_one_candidate_pass`.
6. `compile_time_seconds` is absent from the dict passed to `compute_ratchet_decision`;
   `measure_two_phase_timing` called with `handoff.path` (spy assertion), never a separately
   constructed path.
7. A candidate that clears `stats_battery`/`seed_trial` hard-blocked gates but whose
   `ratchet_decision.improved` is `False` must NOT have `accepted=True`.
8. `git diff` on `controller/multi_iteration_loop.py` shows only comment/docstring text changed.

Run: `uv run --extra dev --extra cli --extra io pytest controller/ -k "main_loop or evaluate_adapter or multi_iteration" -v` (narrow scoped run, not the whole suite -- see `local-compute-limits.md`).

Commit with a descriptive conventional-commit message (e.g. `feat(controller): wire multi-metric
ratchet decision + crash-safe lineage into run_one_candidate_pass (#3649)`) once tests pass.
"""
reviewer_prompt = """
VERIFY:
1. `run_one_candidate_pass` calls `guarded_evaluate_fn` (not `frozen_context.score_fn` or
