fixer_prompt = """
task_id: 260807_autonomous-dev-loop

Wire the real ratchet decision, crash-safe best-so-far lineage (both accept and reject paths), and
compile-time exclusion into `controller/main_loop.py`'s `run_one_candidate_pass`
(`controller/main_loop.py:190-209`). This is the core of GW-02: today `OneCandidatePassResult.accepted`
(`main_loop.py:178-187`) only means "the bathos run succeeded and wasn't hard-blocked by
stats_battery/seed_trial" -- a candidate strictly worse on every metric than the current best is
still marked `accepted=True`. Fix that.

Depends on Track A (`score_raw_artifacts` must exist first).

## Step 1 -- New parameters for scoring (S2.1)

Add to `run_one_candidate_pass`'s signature: `frozen_context: BathosFrozenContext` (required),
`current_config: Mapping[str, Any]` (required -- deliberately distinct from `frozen_context.locked.config`,
per `verify_closure`'s own docstring: recomputing against the locked manifest's own stored config would
make config drift undetectable by construction), `candidate_touched_paths: frozenset[Path] = frozenset()`
(pass-through, matches `guarded_evaluate`'s own default at `closure_lock.py:233`), and a new injection
seam `guarded_evaluate_fn: Callable[..., dict[str, float]] = guarded_evaluate` (mirrors the file's
existing `stats_battery_fn`/`seed_trial_counts_fn`/`candidate_static_fn` convention at
`main_loop.py:205-207` -- this is what a later test patches to assert enforcement).

After the existing `record_candidate_run` dispatch (`controller/lineage_interim.py:155`, KEEP THIS AS
THE SOLE DISPATCH CALL SITE, do not add or replace it): validate `output_paths` (the function's own
EXISTING parameter, `main_loop.py:198` -- NOT anything read off `CandidateRunResult`, whose dataclass
`controller/bathos_campaign_adapter.py:180-191` has only `script_path`/`exit_code`/`success`, no
`output_paths` field) is non-empty, raising `ValueError` if `None`/empty. Then call:
```python
fitness_dict = guarded_evaluate_fn(
    frozen_context.locked, score_raw_artifacts, frozen_context, tuple(output_paths),
    current_config=current_config, candidate_touched_paths=candidate_touched_paths,
)
```
`guarded_evaluate`'s real signature (`src/xtrax/loop/closure_lock.py:226-255`) is
`(locked, evaluator, frozen_context, candidate, *, current_config, candidate_touched_paths=frozenset())`
-- match it exactly. NEVER call `frozen_context.score_fn(...)` or `score_raw_artifacts` directly
outside `guarded_evaluate_fn`. Let `ClosureHashMismatchError`/`EvaluatorClosureDriftError`/
`UnlistedReadError` (`src/xtrax/loop/closure_lock.py:48-65`) propagate UNCAUGHT -- do not wrap in
try/except.

## Step 2 -- best_fitness/higher_is_better + ratchet decision (S2.1b)

Add two new caller-supplied keyword parameters: `best_fitness: Mapping[str, float] | None = None`,
`higher_is_better: Mapping[str, bool] | None = None` (mirror `stats_battery_kwargs`'s docstring
convention at `main_loop.py:202, 234-240`). Immediately validate:
```python
if (best_fitness is None) != (higher_is_better is None):
    raise ValueError(
        f"best_fitness and higher_is_better must both be supplied or both omitted "
        f"(got best_fitness={'set' if best_fitness is not None else None}, "
        f"higher_is_better={'set' if higher_is_better is not None else None})"
    )
```
When both are `None` (first candidate in a campaign, no prior best): do NOT call
`compute_ratchet_decision` -- construct the sentinel
`RatchetDecision(improved=True, win_rate=1.0, breakdown_point=1.0, cohens_d=math.inf, per_metric_delta={})`
directly (check `RatchetDecision`'s real constructor at `src/xtrax/loop/multi_metric_ratchet.py:81-116`
before writing this call). Otherwise call `compute_ratchet_decision(fitness_dict, best_fitness,
higher_is_better=higher_is_better)` (`src/xtrax/loop/multi_metric_ratchet.py:148`).

## Step 3 -- Accept-path crash-atomicity (S2.1c)

Add four new parameters: `repo: Path` (required), `ratchet_ref_name: str` (required),
`commit_tree_sha: str` (required -- real git tree data the caller supplies; this function does not
construct or verify it, mirroring the `stats_battery_kwargs` trust boundary), `commit_parent_sha:
str | None = None` (bootstrap fallback), `commit_message: str | None = None` (optional).

On the accept branch (ratchet_decision.improved is True, whether from a real win or the Step-2
sentinel):
```python
prior_best_sha = read_best_so_far(repo, ratchet_ref_name)
parent_sha = prior_best_sha if prior_best_sha is not None else commit_parent_sha
if parent_sha is None:
    raise ValueError(
        f"commit_parent_sha must be supplied when no prior best-so-far ref exists yet "
        f"(read_best_so_far({ratchet_ref_name!r}) returned None)"
    )
message = commit_message or (
    f"ratchet best-so-far: candidate {handoff.content_sha256}"
    + (f" derived_from={parentage.derived_from}" if parentage.derived_from else " (root candidate)")
)
pending_sha = create_pending_commit(repo, commit_tree_sha, parent_sha, message)
advance_best_so_far(repo, ratchet_ref_name, pending_sha, prior_best_sha)
```
Check the real signatures of `create_pending_commit`/`advance_best_so_far`/`read_best_so_far` at
`src/xtrax/loop/ratchet_crash_atomicity.py:91-158` before writing this. `prior_best_sha` serves as
BOTH the parent-SHA source AND the CAS `expected_old_sha` -- one `read_best_so_far` call, not two.
Let `CommitCreationError`/`RefUpdateConflictError` (lines 34/38) propagate UNCAUGHT.

## Step 4 -- Compile-time clock, post-decision (S2.2)

AFTER the accept/reject decision from Steps 2-3 (never as an input to it): add three new parameters
that genuinely cannot be constructed from anything already in scope: `callable_name: str` (required),
`concrete_inputs: list[Any]` (required), `compile_time_history: Sequence[float] = ()` (this parameter
has no default in `assert_no_compile_time_regression`'s own signature at `compile_time_clock.py:131-167`,
but an empty tuple is that function's own documented no-op case, so default it here), plus a pass-through
`k_threshold: float = 3.0` (matches the module's own default). Derive `candidate_path` internally as
`handoff.path` -- do NOT add it as a new parameter (the exact value already used identically at the
`candidate_static_fn` call site, `main_loop.py:286`; `handoff` only exists after
`dispatch_backend.dispatch_candidate()` runs, so a caller cannot pre-supply a matching path without
risking drift from what was actually dispatched and scored). Call:
```python
timing = measure_two_phase_timing(handoff.path, callable_name, concrete_inputs=concrete_inputs)
assert_no_compile_time_regression(timing.compile_time_seconds, compile_time_history=compile_time_history, k_threshold=k_threshold)
```
(check `measure_two_phase_timing`'s real signature at `compile_time_clock.py:72-116` first).
`compile_time_seconds` must NEVER be merged into the fitness dict `compute_ratchet_decision` compares
-- only `runtime_seconds` is fitness-comparable. `CompileTimeRegressionError` (line 55) raised/escalated
independently, WITHOUT altering the ratchet accept/reject outcome from Steps 2-3.

## Step 5 -- Redefine `.accepted` (S2.3)

Add a `ratchet_decision` field to `OneCandidatePassResult` (`main_loop.py:159`), populated only when
scoring succeeds (an exception aborts the whole call before any partial result is constructed).
Redefine `accepted` (`main_loop.py:178-187` -- `@property` at 179, docstring 180-186, `return` at 187,
NOT line 129 which is an unrelated `CampaignMode` comment) to additionally require
`ratchet_decision.improved`. Update the docstring at lines 180-186 to describe the stricter semantics,
including a note on the first-candidate sentinel from Step 2.

## Step 6 -- Reject-path reset (S2.4)

Add `def reset_worktree_to_best_so_far(repo: Path, ref_name: str) -> str` to
`src/xtrax/loop/ratchet_crash_atomicity.py` (reuse the module's existing private `_git_run` helper --
read the file first, `ratchet_crash_atomicity.py:145-168` is roughly where it belongs): resolve the best
SHA via `read_best_so_far(repo, ref_name)` (raise `RatchetCrashAtomicityError` if `None` -- unreachable
in normal operation given Step 2's automatic-accept-first-candidate design, since a reject can only
happen once a real prior best already exists), run `git reset --hard <best_sha>`, raise
`RatchetCrashAtomicityError` on nonzero exit. Wire this into `run_one_candidate_pass`'s reject branch
(`ratchet_decision.improved is False`): `reset_worktree_to_best_so_far(repo, ratchet_ref_name)` --
reuse the SAME `repo`/`ratchet_ref_name` parameters from Step 3, one source of truth for which repo/ref
this campaign ratchets against. `create_pending_commit`/`advance_best_so_far` remain accept-path-only;
`reset_worktree_to_best_so_far` is reject-path-only. Let `RatchetCrashAtomicityError` propagate UNCAUGHT.

## Step 7 -- Downstream docstring (part of this track, mechanical)

Update `MultiIterationState.accepted_count`'s docstring (`controller/multi_iteration_loop.py:254-256`)
to describe the stricter "was actually promotable per ratchet" semantics from Step 5. Docstring-only --
no code change to `accepted_count`'s implementation (it already intends "was actually promotable").

VERIFY before finishing (write these as new tests, colocated with `tests/controller/test_main_loop.py`
or the existing convention for that file):
1. Candidate strictly worse on every metric than `best_fitness` -> `accepted=False`,
