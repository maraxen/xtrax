[dag]
version = "0.2.2"
state_path = ".praxia/coverage_last_measured.json"

[[tiers]]
id = "tier0_audit"
description = "Deterministic audit contracts (not a coverage surface)"
measure_coverage = false
uv_sync_extras = ["dev"]
pytest_args = ["tests/audit/", "-q"]

[[tiers]]
id = "tier1_core"
description = "Shipped product code (excludes optional eda + dev-only devtools)"
measure_coverage = true
uv_sync_extras = ["dev", "io"]
pytest_args = [
  "tests/",
  "-q",
  "--ignore=tests/eda",
  "--ignore=tests/audit",
  "--ignore=tests/distribution",
  "--ignore=port/tests",
]
coverage_packages = ["xtrax"]
coverage_omit = [
    "*/xtrax/eda/*",
    "*/xtrax/devtools/*",
    "*/tests/*",
    "*/__init__.py",
]
target_line_pct = 90.0
target_branch_pct = 80.0
enforce_line_pct = 90.0
enforce_branch_pct = 80.0

[[tiers]]
id = "tier2_eda"
description = "EDA optional-extra (scoped coverage gate)"
measure_coverage = true
uv_sync_extras = ["dev", "eda"]
pytest_args = ["tests/eda/", "-q"]
coverage_packages = ["xtrax.eda"]
coverage_omit = ["*/tests/*", "*/__init__.py"]
target_line_pct = 90.0
target_branch_pct = 75.0
enforce_line_pct = 90.0
enforce_branch_pct = 75.0

[[tiers]]
id = "tier3_port"
description = "Port validation tests (path-filtered in CI)"
measure_coverage = false
uv_sync_extras = ["dev"]
pytest_args = ["port/tests/", "-q"]

# controller/ is a top-level unshipped tree (wheel-smoke asserts it never ships),
# so tier1's coverage_packages = ["xtrax"] does not reach it. Without this tier its
# 4,456 lines were measured by nothing. The `controller` extra matters as much as the
# tier does: bathos is what makes test_bathos_library_wrappers_integration.py's
# collection-level importorskip pass, and installing it took tests/controller/ from
# 259 passed / 2 skipped to 268 passed / 0 skipped.
[[tiers]]
id = "tier4_controller"
description = "Loop controller (unshipped tree; real-bathos surface)"
measure_coverage = true
uv_sync_extras = ["dev", "io", "controller"]
pytest_args = ["tests/controller/", "-q"]
coverage_packages = ["controller"]
coverage_omit = ["*/tests/*", "*/__init__.py"]
target_line_pct = 90.0
target_branch_pct = 80.0
enforce_line_pct = 90.0
enforce_branch_pct = 80.0
