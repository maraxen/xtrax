[[automated_checks]]
name = "import_cycles"
recipe = "audit-imports"
category = "foundation"
blocking = true

[[automated_checks]]
name = "no_future_annotations"
recipe = "audit-no-future-annotations"
category = "foundation"
blocking = true

[[automated_checks]]
name = "jaxlint_performance"
recipe = "audit-jaxlint"
category = "foundation"
blocking = true

[[automated_checks]]
name = "ruff_lint"
command = "uv run ruff check ."
category = "ci_lint"
blocking = true

[[automated_checks]]
name = "ruff_format"
command = "uv run ruff format --check ."
category = "ci_lint"
blocking = true

[[automated_checks]]
name = "ty_check"
command = "uv run ty check src/"
category = "ci_lint"
blocking = true

[[automated_checks]]
name = "coverage_tier1"
recipe = "audit-coverage-tier1"
category = "coverage"
blocking = true
slow = true

[[automated_checks]]
name = "coverage_tier2"
recipe = "audit-coverage-tier2"
category = "coverage"
blocking = true
slow = true

[[automated_checks]]
name = "io_reexport_doctest"
command = "uv run pytest --doctest-modules src/xtrax/io/ -q"
category = "docs"
blocking = true

[[automated_checks]]
name = "audit_contracts"
recipe = "audit-deterministic"
category = "deterministic_track"
blocking = true
slow = true

[[automated_checks]]
name = "added_types_diff"
recipe = "audit-added-types-diff"
category = "type_hardening"
blocking = true

[readiness.workflow_markers]
ci_workflow = ".github/workflows/ci.yml"
publish_workflow = ".github/workflows/publish.yml"
docs_workflow = ".github/workflows/docs.yml"
required_ci_markers = [
  "audit-deterministic",
  "audit-coverage-tier1",
  "audit-coverage-tier2",
  "--doctest-modules src/xtrax/io/",
]
required_publish_markers = [
  "publish-testpypi",
  "publish-pypi",
  "id-token: write",
  "test.pypi.org/legacy",
]
