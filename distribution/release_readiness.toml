[readiness]
version = "0.1.0"
epic_id = 1451
epic_title = "xtrax distribution readiness (N0-N10)"
report_json = ".praxia/release_readiness_report.json"
report_markdown = ".praxia/release_readiness_report.md"
prerequisite_sync = ["dev", "eda"]
prerequisite_groups = ["docs"]

[readiness.verdict]
require_automated_pass = true
block_on_open_human_gates = true

[[backlog_items]]
id = 1451
slug = "n0_coverage_hygiene"
title = "[N0] Remove stale committed .coverage + gitignore coverage artifacts"
