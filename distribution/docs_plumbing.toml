[docs]
version = "0.1.0"
sphinx_conf = "docs/conf.py"
readthedocs_config = ".readthedocs.yaml"
workflow = ".github/workflows/docs.yml"
source_dir = "docs"
build_dir = "docs/_build"
sphinx_builder = "html"
sphinx_warn_is_error = true
sphinx_nitpicky = true
install_groups = ["docs"]
install_extras = ["eda"]

[docs.required_extensions]
names = [
  "sphinx.ext.autodoc",
  "sphinx.ext.autosummary",
  "sphinx.ext.napoleon",
  "sphinx.ext.intersphinx",
  "sphinx_autodoc_typehints",
  "myst_parser",
]

[docs.required_conf_keys]
keys = [
  "autosummary_generate",
  "html_theme",
  "intersphinx_mapping",
]
